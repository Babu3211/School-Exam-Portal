name: V47 isolated preview hosting (never production)
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - '.github/workflows/v47-preview-hosting.yml'
permissions:
  contents: read
concurrency:
  group: v47-isolated-preview-only
  cancel-in-progress: false
jobs:
  deploy-v47-preview:
    if: github.ref == 'refs/heads/smss-v47-multischool-work'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate isolated V47 assets
        run: |
          node v47/build-hosting.mjs
          test -f v47/dist/index.html
          test -f v47/dist/admin.html
          test -f v47/dist/school-login.html
          test ! -f v47/dist/firestore.rules
          node --check v47/school-login.mjs
          node --input-type=module -e 'import {readFileSync} from "node:fs"; const c=JSON.parse(readFileSync("v47/firebase.json","utf8")); if(Object.keys(c).join(",")!=="hosting"||c.hosting.public!=="dist") throw Error("Preview must contain isolated Hosting only");'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install V47 test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Require V47 security checks before preview
        run: |
          node v47/test-hosting-bundle.mjs
          npm run test:v47:syntax
          npm run test:v47:emulator
          npm run test:v47:rules-iemis-syntax
          npm run test:v47:verified-import
      - name: Test V47 school onboarding and pagination
        run: node v47/test-school-admin-services.mjs
      - name: Verify all school roles can view class-wise subjects
        run: node v47/test-subject-catalog-view.mjs
      - name: Verify first-release navigation scope and read-only report routes
        run: |
          node v47/test-dashboard-access.mjs
          node v47/test-grade-report-browser-ui.mjs
      - name: Verify teacher account Excel validation and school isolation
        run: |
          node v47/test-teacher-account-excel.mjs
          node v47/test-teacher-staff-link.mjs
      - name: Verify V47 Super Admin session security
        run: node v47/test-super-admin-session-guard.mjs
      - name: Enforce V47 marks publication safety
        run: node v47/test-production-marks-guard.mjs
      # Gate subordinate account creation, stale UID clearing and tenant isolation on real browser testing.
      - name: Install Chromium E2E dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund --no-save firebase@11.10.0 esbuild@0.25.5 playwright@1.52.0
          npm install --prefix v47-runtime --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser login and mobile layout acceptance
        env:
          GCLOUD_PROJECT: demo-smss-v47-browser
        run: npx firebase emulators:exec --project demo-smss-v47-browser --config v47/firebase.browser-test.json --only auth,firestore "node v47/browser-e2e/run.mjs"
      - name: Check V47 deployment credentials
        env:
          V47_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 }}
        run: |
          if [ -z "$V47_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 repository secret; no deployment attempted."
            exit 1
          fi
          node -e 'let c; try {c=JSON.parse(process.env.V47_SERVICE_ACCOUNT)} catch {throw Error("Invalid V47 credential format")} if(c.type!=="service_account"||c.project_id!=="smss-exam-portal-v47")throw Error("Wrong Firebase credential project; preview refused")'
      - name: Deploy to V47 preview channel only
        env:
          V47_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 }}
        run: |
          umask 077
          credential_file="$(mktemp "$RUNNER_TEMP/v47-credentials.XXXXXX")"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$V47_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          unset V47_SERVICE_ACCOUNT
          npx --yes firebase-tools@14.21.0 hosting:channel:deploy v47-test --project smss-exam-portal-v47 --config v47/firebase.json --expires 7d --non-interactive
          echo 'V47 preview only; no production Hosting channel, rules, database migration, billing change or V46 deployment.' >> "$GITHUB_STEP_SUMMARY"
