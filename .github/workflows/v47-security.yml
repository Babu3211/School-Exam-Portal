name: V47 isolated security tests
on:
  push:
    branches: [smss-v47-multischool-work]
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: V47 structural and emulator authorization checks
        run: npm run test:v47
