name: V47 isolated security tests
on:
  push:
    branches: [smss-v47-multischool-work]
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # No lockfile on this branch; install without lockfile-based cache.
      - name: Install V47 test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: V47 structural and emulator authorization checks
        run: npm run test:v47
