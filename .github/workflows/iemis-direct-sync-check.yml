name: V46 Direct Sync read-only checks
on:
  push:
    branches: [feat/v46-iemis-direct-sync-safe]
  pull_request:
    branches: [main]
    paths:
      - 'iemis-direct-saved-marks.js'
      - 'scripts/test-iemis-direct-saved-marks.mjs'
      - 'index.html'
      - 'sw.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-iemis-direct-saved-marks.mjs
      - run: node scripts/check-inline-js.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run test:iemis-transfer
      - run: npm run test:iemis
      - run: npm run test:pwa
      - run: npm run test:v46-preservation
