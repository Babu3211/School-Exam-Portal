name: V47 Full Verification (No Deployment)
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - 'v47/**'
      - 'scripts/test-v47-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v47-full-verification.yml'
permissions:
  contents: read
concurrency:
  group: v47-full-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-v47:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete V47 regression and Firestore emulator suite
        run: |
          set -o pipefail
          npm run test:v47 2>&1 | tee v47-full-tests.log
      - name: Publish regression result to job summary
        if: always()
        run: |
          {
            echo '## V47 regression suite'
            echo ''
            if [ ! -f v47-full-tests.log ]; then
              echo 'Result: **NOT RUN** — dependency installation or setup failed.'
            elif grep -Eq '(^|[[:space:]])(not ok|FAIL|Error:|AssertionError)' v47-full-tests.log; then
              echo 'Result: **FAILURES DETECTED** — inspect the saved test log.'
            else
              echo 'Test log captured; inspect the workflow step conclusion for authoritative PASS/FAIL.'
            fi
            echo ''
            echo 'The workflow never deploys or writes production Firestore data.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture static V47 feature parity evidence
        if: always()
        run: |
          if node v47/release-evidence-report.mjs > v47-feature-evidence.json 2> v47-feature-evidence-error.log; then
            status=0
            echo 'Static feature evidence: no blockers reported (manual acceptance still required).' >> "$GITHUB_STEP_SUMMARY"
          else
            status=$?
            echo 'Static feature evidence: blockers detected; see artifact.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s v47-feature-evidence-error.log ]; then cat v47-feature-evidence-error.log; fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-verification-logs
          path: |
            v47-full-tests.log
            v47-feature-evidence.json
            v47-feature-evidence-error.log
          if-no-files-found: ignore
  release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check release blockers (deployment remains disabled)
        if: always()
        run: |
          if npm run test:v47:release > v47-release-gate.log 2>&1; then
            status=0
          else
            status=$?
          fi
          cat v47-release-gate.log
          echo "Release gate exit status: $status"
          {
            echo "## V47 release readiness"
            echo ""
            echo "Release gate exit code: **$status** (nonzero means deployment blocked)."
            echo ""
            echo "### Release gate findings"
            echo '```text'
            cat v47-release-gate.log
            echo '```'
            echo ""
            echo "No deployment was attempted by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v47-release-blockers
          path: v47-release-gate.log
          if-no-files-found: ignore
