name: V47 isolated Hosting test preview
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: v47-isolated-hosting-test-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smss-v47-multischool-work
      - name: Build V47-only hosting distribution
        run: |
          node v47/build-hosting.mjs
          test -f v47/dist/index.html
          test -f v47/dist/admin.html
          test -f v47/dist/school-login.html
          test -f v47/dist/school-login.mjs
          test ! -f v47/dist/firestore.rules
          test ! -f v47/dist/firebase.json
          node -e 'const c=require("./v47/firebase.json");if(c.hosting.public!=="dist")process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated V47 test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run V47 security and import checks before preview
        run: |
          npm run test:v47:syntax
          npm run test:v47:emulator
          npm run test:v47:rules-iemis-syntax
          npm run test:v47:verified-import
          node v47/test-hosting-bundle.mjs
      - name: Verify V47 Super Admin session isolation
        run: node v47/test-super-admin-session-guard.mjs
      - name: Verify V47 Super Admin session security
        run: node v47/test-super-admin-session-guard.mjs
      - name: Enforce V47 marks publication safety
        run: node v47/test-production-marks-guard.mjs
      - name: Require dedicated V47 Firebase credential
        env:
          V47_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 }}
        run: |
          if [ -z "$V47_SERVICE_ACCOUNT" ]; then
            echo "::error::V47 Firebase service account secret is missing. Preview deployment blocked."
            exit 1
          fi
          echo "Dedicated V47 credential is configured (value not printed)."
      - name: Deploy to V47 preview channel only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 }}
          projectId: smss-exam-portal-v47
          channelId: v47-test
          expires: 7d
          entryPoint: v47
      - name: Preview scope
        run: echo "Only V47 Firebase preview channel v47-test was targeted; no live channel or V46 project."
