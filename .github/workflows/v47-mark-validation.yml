name: V47 mark validation
on:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - 'v47/subject-mark-limits.mjs'
      - 'v47/subject-validation.mjs'
      - 'v47/subject-create-service.mjs'
      - 'v47/subjects.html'
      - 'v47/subjects-console.mjs'
      - 'v47/test-subject-configured-marks.mjs'
      - 'v47/v46-iemis-ledger.js'
      - 'v47/test-v46-iemis-parity.mjs'
      - 'v47/v46-result-adapter.mjs'
      - 'v47/test-v46-result-adapter.mjs'
      - 'v47/school-result-preview.mjs'
      - 'v47/test-school-result-preview.mjs'
      - 'v47/marks-audit.mjs'
      - 'v47/test-marks-audit-configured-scale.mjs'
      - 'v47/class-marks-coverage.mjs'
      - 'v47/test-class-marks-coverage.mjs'
      - 'v47/test-large-class-marks-coverage.mjs'
      - 'v47/complete-class-result-preview.mjs'
      - 'v47/test-complete-class-result-preview.mjs'
      - 'v47/marks-query.mjs'
      - 'v47/complete-class-marks-query.mjs'
      - 'v47/test-complete-class-marks-query.mjs'
      - 'v47/complete-school-subjects.mjs'
      - 'v47/test-complete-school-subjects.mjs'
      - 'v47/test-subject-decimal-input.mjs'
      - 'v47/legacy-subject-credit-repair.mjs'
      - 'v47/test-legacy-subject-credit-repair.mjs'
      - 'v47/subject-validation.mjs'
      - 'v47/school-class-result-diagnostic.mjs'
      - 'v47/class-publication-preflight.mjs'
      - 'v47/test-class-publication-preflight.mjs'
      - 'v47/test-marks-release-safety.mjs'
      - 'v47/firestore.rules'
      - 'v47/release-readiness-gate.mjs'
      - 'v47/firestore-adapter.mjs'
      - 'v47/test-school-store-isolation.mjs'
      - 'v47/student-service.mjs'
      - 'v47/student-validation.mjs'
      - 'v47/test-student-create-roster.mjs'
      - 'v47/permissions.mjs'
      - 'v47/test-permissions.mjs'
      - 'v47/marks-service.mjs'
      - 'v47/test-unbounded-mark-entry.mjs'
      - 'v47/mark-create-service.mjs'
      - 'v47/class-mark-completeness.mjs'
      - 'v47/test-class-mark-completeness.mjs'
      - 'v47/complete-class-roster.mjs'
      - 'v47/test-complete-class-roster.mjs'
      - 'v47/attendance-roster.mjs'
      - 'v47/verified-small-class-mark-save.mjs'
      - 'v47/test-verified-small-class-mark-save.mjs'
      - 'v47/verified-class-mark-staging.mjs'
      - 'v47/test-verified-class-mark-staging.mjs'
      - 'v47/class-mark-staging-integrity.mjs'
      - 'v47/test-class-mark-staging-integrity.mjs'
      - 'v47/class-mark-staging-plan.mjs'
      - 'v47/test-class-mark-staging-plan.mjs'
      - 'v47/class-mark-save.mjs'
      - 'v47/test-subject-mark-limits.mjs'
      - 'v47/test-mark-create-authorization.mjs'
      - 'v47/test-class-mark-save.mjs'
      - '.github/workflows/v47-mark-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check V47 mark and result modules
        run: |
          node --check v47/complete-class-roster.mjs
          node --check v47/test-complete-class-roster.mjs
          node --check v47/verified-small-class-mark-save.mjs
          node --check v47/test-verified-small-class-mark-save.mjs
          node --check v47/class-mark-completeness.mjs
          node --check v47/test-class-mark-completeness.mjs
          node --check v47/verified-class-mark-staging.mjs
          node --check v47/test-verified-class-mark-staging.mjs
          node --check v47/class-mark-staging-integrity.mjs
          node --check v47/test-class-mark-staging-integrity.mjs
          node --check v47/class-mark-staging-plan.mjs
          node --check v47/test-class-mark-staging-plan.mjs
          node --check v47/class-mark-save.mjs
          node --check v47/test-class-mark-save.mjs
          node --check v47/firestore-adapter.mjs
          node --check v47/test-school-store-isolation.mjs
          node --check v47/student-service.mjs
          node --check v47/test-student-create-roster.mjs
          node --check v47/permissions.mjs
          node --check v47/test-permissions.mjs
          node --check v47/marks-query.mjs
          node --check v47/complete-class-marks-query.mjs
          node --check v47/test-complete-class-marks-query.mjs
          node --check v47/test-large-class-marks-coverage.mjs
          node --check v47/school-result-preview.mjs
          node --check v47/complete-class-result-preview.mjs
          node --check v47/class-publication-preflight.mjs
          node --check v47/test-marks-release-safety.mjs
          node --check v47/test-school-result-preview.mjs
      - name: Verify tenant isolation in shared school records
        run: node v47/test-school-store-isolation.mjs
      - name: Verify student creation and roster compatibility
        run: node v47/test-student-create-roster.mjs
      - name: Verify permission operation and tenant boundaries
        run: node v47/test-permissions.mjs
      - name: Verify release remains fail-closed
        run: node v47/test-marks-release-safety.mjs
      - name: Verify production release gate blocks incomplete V47
        shell: bash
        run: |
          set +e
          node v47/release-readiness-gate.mjs > /tmp/v47-release-gate.log 2>&1
          status=$?
          set -e
          cat /tmp/v47-release-gate.log
          if [ "$status" -eq 0 ]; then
            echo "ERROR: Unapproved V47 release gate passed" >&2
            exit 1
          fi
          grep -q 'V47 PRODUCTION RELEASE BLOCKED' /tmp/v47-release-gate.log
          grep -q 'Full-class marks save is limited' /tmp/v47-release-gate.log
          grep -q 'Firestore marks writes are disabled' /tmp/v47-release-gate.log
          grep -q 'Computer component marks saving is disabled' /tmp/v47-release-gate.log

      - name: Verify class publication safety preflight
        run: node v47/test-class-publication-preflight.mjs
      - name: Verify legacy subject credit-hour repair
        run: node v47/test-legacy-subject-credit-repair.mjs
      - name: Verify subject Examination Settings decimal inputs
        run: node v47/test-subject-decimal-input.mjs
      - name: Verify complete school subject roster
        run: node v47/test-complete-school-subjects.mjs
      - name: Verify complete school marks pagination
        run: node v47/test-complete-class-marks-query.mjs
      - name: Verify complete class V46 GPA diagnostic
        run: node v47/test-complete-class-result-preview.mjs
      - name: Verify 1500-student 20-subject marks coverage
        run: node v47/test-large-class-marks-coverage.mjs
      - name: Verify complete class roster coverage
        run: node v47/test-class-marks-coverage.mjs
      - name: Verify raw audit configured marks
        run: node v47/test-marks-audit-configured-scale.mjs
      - name: Verify school-scoped V46 result preview
        run: node v47/test-school-result-preview.mjs
      - name: Verify V46 result adapter
        run: node v47/test-v46-result-adapter.mjs
      - name: Verify V46 IEMIS grading baseline
        run: node v47/test-v46-iemis-parity.mjs
      - name: Validate subject full-mark creation
        run: node v47/test-subject-configured-marks.mjs
      - name: Validate unrestricted mark parsing
        run: node v47/test-unbounded-mark-entry.mjs
      - name: Validate examination full marks
        run: node v47/test-subject-mark-limits.mjs
      - name: Validate individual marks authorization
        run: node v47/test-mark-create-authorization.mjs
      - name: Verify complete 1500-student roster pagination
        run: node v47/test-complete-class-roster.mjs
      - name: Validate full 1500-student class marks completeness
        run: node v47/test-class-mark-completeness.mjs
      - name: Validate 1500-student read-only staging plan
        run: node v47/test-class-mark-staging-plan.mjs
      - name: Verify 1500-student staging manifest integrity
        run: node v47/test-class-mark-staging-integrity.mjs
      - name: Validate authoritative 1500-student staging preparation
        run: node v47/test-verified-class-mark-staging.mjs
      - name: Validate atomic class marks
        run: node v47/test-class-mark-save.mjs
      - name: Verify authoritative roster before small-class save
        run: node v47/test-verified-small-class-mark-save.mjs
