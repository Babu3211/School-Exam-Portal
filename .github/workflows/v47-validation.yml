name: V47 Multi-School Validation
on:
  push:
    branches: [smss-v47-multischool-work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v47-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  v47-unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: V47 syntax and tenant tests
        run: |
          npm run test:v47:syntax
          npm run test:v47:tenant-context
          npm run test:v47:tenant-firestore
          npm run test:v47:v46-readonly-bridge
          npm run test:v47:v46-report-snapshot
          node v47/test-report-preview-wiring.mjs
          node v47/test-report-reference-audit.mjs
          node v47/test-iemis-ledger-parity.mjs
          node v47/test-iemis-entry-parity.mjs
          node v47/test-iemis-schema-ui.mjs
          node v47/test-iemis-class-draft-preflight.mjs
          node v47/test-configured-mark-preflight.mjs
          node v47/test-verified-subject-exam-settings.mjs
          node v47/test-computer-subject-selection.mjs
          node v47/test-dynamic-class-marks-ui.mjs
          node v47/test-class-marks-session-revalidation.mjs
          node v47/test-class-mark-inspection-session.mjs
          node v47/test-class-marks-absence-ui.mjs
          node v47/test-dynamic-component-rules.mjs
          node v47/test-mark-settings-rules.mjs
          node v47/test-preview-v46-mark-settings-migration.mjs
          node v47/test-preview-v46-primary-achievement-settings.mjs
          node v47/test-audit-v46-mark-settings-batch.mjs
          node v47/test-configured-class-publication-preview.mjs
          node v47/test-class-marks-review-package.mjs
          node v47/test-verify-class-marks-review-package.mjs
          node v47/test-verified-teacher-subject-assignment.mjs
          node v47/test-verified-teacher-attendance-duty.mjs
          node v47/test-teacher-assigned-class-ui.mjs
          node v47/audit-v46-feature-parity.mjs
          node v47/test-audit-v46-feature-parity.mjs
          node v47/test-school-settings-ui.mjs
          node v47/test-records-auth-switch.mjs
          node v47/test-class-publication-ui-wiring.mjs
          node v47/test-class-inspection-postawait-guard.mjs
          node v47/test-class-marks-same-snapshot.mjs
          node v47/test-class-inspection-settings-refresh.mjs
          node v47/test-class-inspection-roster-refresh.mjs
          node v47/test-create-subject-exam-settings.mjs
          node v47/test-create-settings-ui-wiring.mjs
          node v47/test-settings-component-uniqueness-rules.mjs
          node v47/test-firestore-rules-tail-integrity.mjs
          node v47/test-discover-subject-exam-settings.mjs
          node v47/test-mark-summary-preview.mjs
          node v47/test-class-mark-coverage-preview.mjs
          npm run test:v47:v46-tenant-rewrite
          npm run test:v47:v46-excel-parity
          npm run test:v47:v46-student-schema
          npm run test:v47:contract
          npm run test:v47:scope
          npm run test:v47:teacher-assignments
          npm run test:v47:mark-create-auth
          npm run test:v47:attendance-save
          npm run test:v47:marks-save
          npm run test:v47:records-session
          node v47/test-records-refresh-session.mjs
          node v47/test-school-admin-login-cancel.mjs
          node v47/test-redact-record-preview.mjs
          node v47/test-marks-login-cancel-ui.mjs
          npm run test:v47:iemis-school-id
          npm run test:v47:structure
          npm run test:v47:terms
          npm run test:v47:term-rules
          npm run test:v47:exam-service
          npm run test:v47:marks-complete
          npm run test:v47:large-class-plan
          npm run test:v47:mark-draft
          npm run test:v47:attendance-complete
          npm run test:v47:ui-language
          npm run test:v47:student-import-rules
          npm run test:v47:rules-iemis-syntax
  v47-firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Firestore school isolation tests
        run: npm run test:v47:emulator
