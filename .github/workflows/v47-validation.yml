name: V47 Multi-School Validation
on:
  push:
    branches: [smss-v47-multischool-work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v47-unit-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: V47 syntax and tenant tests
        run: |
          npm run test:v47:syntax
          npm run test:v47:tenant-context
          npm run test:v47:tenant-firestore
          npm run test:v47:v46-readonly-bridge
          npm run test:v47:v46-report-snapshot
          node v47/test-report-preview-wiring.mjs
          node v47/test-report-reference-audit.mjs
          node v47/test-iemis-ledger-parity.mjs
          node v47/test-iemis-entry-parity.mjs
          node v47/test-iemis-schema-ui.mjs
          node v47/test-iemis-class-draft-preflight.mjs
          node v47/test-configured-mark-preflight.mjs
          node v47/test-verified-subject-exam-settings.mjs
          node v47/test-mark-summary-preview.mjs
          node v47/test-class-mark-coverage-preview.mjs
          npm run test:v47:v46-tenant-rewrite
          npm run test:v47:v46-excel-parity
          npm run test:v47:v46-student-schema
          npm run test:v47:contract
          npm run test:v47:scope
          npm run test:v47:teacher-assignments
          npm run test:v47:mark-create-auth
          npm run test:v47:attendance-save
          npm run test:v47:marks-save
          npm run test:v47:records-session
          node v47/test-records-refresh-session.mjs
          node v47/test-school-admin-login-cancel.mjs
          node v47/test-redact-record-preview.mjs
          node v47/test-marks-login-cancel-ui.mjs
          npm run test:v47:iemis-school-id
          npm run test:v47:structure
          npm run test:v47:terms
          npm run test:v47:term-rules
          npm run test:v47:exam-service
          npm run test:v47:marks-complete
          npm run test:v47:large-class-plan
          npm run test:v47:mark-draft
          npm run test:v47:attendance-complete
          npm run test:v47:ui-language
          npm run test:v47:student-import-rules
          npm run test:v47:rules-iemis-syntax
  v47-firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - name: Firestore school isolation tests
        run: npm run test:v47:emulator
