name: V46 Question Paper Hosting Preview (never live)
on:
  push:
    branches:
      - feat/v46-question-autogen-grid-safe-2083
    paths:
      - '.github/workflows/v46-question-review-hosting-preview.yml'
      - 'cdc-*.mjs'
      - 'cdc-question-paper.js'
      - 'sw.js'
      - 'data/cdc-*.json'
      - 'scripts/test-cdc-grade9-review-pack.mjs'
      - 'scripts/audit-grade9-grid-catalog.py'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: smss-v46-question-review-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.repository == 'Babu3211/School-Exam-Portal' && github.ref == 'refs/heads/feat/v46-question-autogen-grid-safe-2083'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify question banks and preserved app before preview
        run: |
          node scripts/check-inline-js.mjs
          node scripts/check-v44-requirements.mjs
          npm run test:v46-preservation
          npm run test:question-paper
          npm run test:pwa
          node scripts/test-cdc-grade9-review-pack.mjs
      - name: Stage static teacher review only (no authentication or production database)
        run: |
          set -euo pipefail
          mkdir -p preview-public
          SMSS_REVIEW_PACK_DIR=preview-public node scripts/test-cdc-grade9-review-pack.mjs
          if ! command -v pdftoppm >/dev/null || ! command -v pdfinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          python3 -m py_compile scripts/audit-grade9-grid-catalog.py
          python3 scripts/audit-grade9-grid-catalog.py --preview-grid-dir preview-public
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("preview-public")
          manifest=json.loads((root/"grid-source-pages/manifest.json").read_text())
          assert manifest["currentCdcExactApproved"] is False
          expected={"11168":5,"11169":3,"11170":1,"11167":2,"11166":3,"optional-computer":1,"optional-math":1,"optional-economics":2,"accounting":2}
          docs=manifest["documents"]
          assert len(docs)==len(expected) and {d["resource"] for d in docs}==set(expected)
          declared=set()
          for doc in docs:
              assert doc["currentCdcExactApproved"] is False
              if doc["status"]=="fingerprint_matched_pages_rendered":
                  assert len(doc["images"])==expected[doc["resource"]]
                  for i,p in enumerate(doc["images"],1):
                      assert p=="grid-source-pages/"+doc["resource"]+"-page-"+str(i)+".png"
                      assert (root/p).read_bytes().startswith(bytes([137,80,78,71,13,10,26,10]))
                      declared.add(p)
              else:
                  assert doc["status"]=="unavailable" and not doc["images"]
          assert declared=={str(p.relative_to(root)) for p in (root/"grid-source-pages").glob("*.png")}
          print("Grid source inventory:",len(declared),"/",sum(expected.values()),"pages staged; unavailable documents are explicitly labelled.")
          PY
          cp preview-public/grade9-teacher-review.html preview-public/index.html
          printf '%s\n' "$GITHUB_SHA" > preview-public/review-revision.txt
          cp index.html preview-public/app-shell.html
          cp manifest.webmanifest cdc-question-paper.js cdc-*.mjs preview-public/
          cp -r data preview-public/data
          cp sw.js preview-public/app-worker-source.js
          # Retire the previously installed preview service worker, if any.
          # Its cache namespace is origin-local; no live-origin cache is touched.
          cat > preview-public/sw.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', event => event.waitUntil((async () => {
            for (const key of await caches.keys()) if (key.startsWith('smss-pwa-')) await caches.delete(key);
            await self.clients.claim();
            await self.registration.unregister();
          })()));
          JS
          # This modifies only the runner's staging configuration, not GitHub or live Hosting.
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          config.hosting.public='preview-public';
          config.hosting.headers=[
            {source:'**',headers:[
              {key:'Content-Security-Policy',value:"default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; script-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"},
              {key:'X-Content-Type-Options',value:'nosniff'},
              {key:'Cache-Control',value:'no-store'},
              {key:'Referrer-Policy',value:'no-referrer'}
            ]}
          ];
          fs.writeFileSync('firebase.json',JSON.stringify(config,null,2));
          JS
      - name: Deploy isolated static review channel (no Firestore rules or data)
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: v46-question-review
          expires: 7d
          entryPoint: .
      - name: Verify hosted review pack, isolation headers and all question modules
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: |
          set -euo pipefail
          [[ "$PREVIEW_URL" == https://exam-portal-smss-95016--*.web.app ]]
          mkdir -p "$RUNNER_TEMP/preview"
          # A preview channel may briefly serve the preceding release at an
          # edge after deployment. Retry only a bounded number of times;
          # never relax the exact byte comparison or isolation checks.
          verify_asset() {
            local source="$1" route="$2" target="$3" attempt
            mkdir -p "$(dirname "$target")"
            for attempt in 1 2 3 4 5 6; do
              if curl -fsSL --max-time 25 --retry 1 -H 'Cache-Control: no-cache' \
                  -D "$target.headers" "$PREVIEW_URL$route?revision=$GITHUB_SHA&check=$attempt" -o "$target" \
                && cmp -s "$source" "$target"; then
                return 0
              fi
              echo "Preview content not current: $route (attempt $attempt)"
              if [ "$attempt" -lt 6 ]; then sleep 5; fi
            done
            echo "::error::Exact preview comparison failed for $route"
            sha256sum "$source" "$target" 2>/dev/null || true
            return 1
          }
          verify_asset preview-public/review-revision.txt /review-revision.txt "$RUNNER_TEMP/preview/review-revision.txt"
          verify_asset preview-public/index.html / "$RUNNER_TEMP/preview/index.html"
          grep -i '^content-security-policy:' "$RUNNER_TEMP/preview/index.html.headers" | grep -F "connect-src 'none'" | grep -F "script-src 'none'"
          grep -qF 'REVIEW ONLY' "$RUNNER_TEMP/preview/index.html"
          if grep -Eq 'initializeApp\(|firebaseConfig|<script|<form' "$RUNNER_TEMP/preview/index.html"; then
            echo 'Unexpected authentication or executable UI in review page'; exit 1
          fi
          # Expand paths inside the staged Hosting root, not the repository root.
          # Require all 32 individual documents and compare each exact byte sequence.
          shopt -s nullglob
          paper_files=(preview-public/papers/*.html)
          test "${#paper_files[@]}" -eq 32
          for source in preview-public/sw.js preview-public/app-worker-source.js preview-public/app-shell.html preview-public/manifest.webmanifest preview-public/grade9-teacher-review.html preview-public/grade9-cdc-grid-library.html preview-public/review-manifest.json preview-public/cdc-question-paper.js preview-public/cdc-*.mjs preview-public/data/cdc-*.json preview-public/grid-source-pages/manifest.json preview-public/grid-source-pages/*.png "${paper_files[@]}"; do
            file="${source#preview-public/}"
            target="$RUNNER_TEMP/preview/$file"
            verify_asset "$source" "/$file" "$target"
            if [[ "$file" == papers/*.html ]]; then
              grep -i '^content-security-policy:' "$target.headers" | grep -F "connect-src 'none'" | grep -F "script-src 'none'"
              grep -qF 'REVIEW ONLY' "$target"
            fi
          done
          # Check the ordinary unversioned root as well, so the published link
          # is only reported after the actual landing page is current.
          matched=false
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$PREVIEW_URL/" -o "$RUNNER_TEMP/preview/root.html" && cmp -s preview-public/index.html "$RUNNER_TEMP/preview/root.html"; then
              matched=true; break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          test "$matched" = true
          echo "Verified revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Teacher review URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only synthetic review page, scripts and database connections blocked by CSP. Real account, backup, and release approval remain separate prerequisites." >> "$GITHUB_STEP_SUMMARY"
# No live channel, rules deployment, billing change, or school-data write.
