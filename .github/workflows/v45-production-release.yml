name: Deploy approved SMSS V45 to Firebase Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-V45 after approving native print, school logo and IEMIS NG discrepancy policy'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smss-production-hosting
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY-V45' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies without a lockfile
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify JavaScript and retained V44 requirements
        run: |
          node scripts/check-inline-js.mjs
          node --check cdc-question-paper.js
          node scripts/check-v44-requirements.mjs
          npm run test:iemis
          npm run test:pwa
          npm run test:question-paper
      - name: Verify Firestore rules against emulator (no production writes)
        run: npm run test:rules
      - name: Verify committed HD Android and iOS PNG icons (never overwrite uploaded originals)
        run: |
          python - <<'PY'
          import struct
          for filename, expected in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              with open(filename,'rb') as image:
                  header=image.read(24)
              assert header[:8]==bytes.fromhex('89504e470d0a1a0a'), filename
              width,height=struct.unpack('>II',header[16:24])
              assert (width,height)==(expected,expected),(filename,width,height)
          PY
      - name: Deploy Hosting only (never deploy Firestore rules or modify marks)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: live
          entryPoint: .
      - name: Smoke-test production HTML, manifest and icon
        run: |
          set -euo pipefail
          url=https://exam-portal-smss-95016.web.app
          curl --fail --location --retry 5 --retry-delay 3 "$url/" -o /tmp/smss-index.html
          grep -Fq 'SMSS Exam Portal' /tmp/smss-index.html
          curl --fail --location "$url/manifest.webmanifest" -o /tmp/smss-manifest.json
          node -e 'const m=require("/tmp/smss-manifest.json");if(m.name!=="SMSS Exam Portal"||!m.icons.some(x=>x.src==="./icon-512.png"))process.exit(1)'
          curl --fail --location "$url/smss-uploaded-icon.svg" -o /tmp/smss-icon.svg
          grep -Fq '<svg' /tmp/smss-icon.svg
          for asset in icon-192.png icon-512.png apple-touch-icon.png; do
            curl --fail --location "$url/$asset" -o "/tmp/$asset"
            ASSET_PATH="/tmp/$asset" node -e 'const fs=require("node:fs");const b=fs.readFileSync(process.env.ASSET_PATH);if(b.length<100||b.subarray(0,8).toString("hex")!=="89504e470d0a1a0a")process.exit(1)'
          done
          echo "V45 production HTML, PWA manifest, SVG and mobile PNG icons verified."
