name: V47 Import Security Checks
on:
  push:
    branches:
      - smss-v47-multischool-work
    paths:
      - 'v47/**'
      - 'package.json'
      - 'scripts/test-v47-emulator-isolation.mjs'
      - '.github/workflows/v47-import-security.yml'
  workflow_dispatch:
jobs:
  import-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Build isolated V47 static hosting
        run: node v47/build-hosting.mjs
      - name: Test V47 isolated hosting bundle
        run: node v47/test-hosting-bundle.mjs
      - name: Verify V47 Super Admin session isolation
        run: node v47/test-super-admin-session-guard.mjs
      - name: Enforce V47 marks publication safety
        run: node v47/test-production-marks-guard.mjs
      - name: Upload V47 hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: v47-hosting-dist
          path: v47/dist/
          retention-days: 7
      - name: Check V47 module and emulator syntax
        run: npm run test:v47:syntax
      - name: V46 IEMIS student Excel preview and normalization
        run: npm run test:v47:iemis-student-preview

      - name: Authenticated V46 import preflight
        run: npm run test:v47:verified-import
      - name: IEMIS school identity validation
        run: npm run test:v47:iemis-school-id
      - name: English UI labels and Nepali guidance
        run: npm run test:v47:ui-language
      - name: Multilingual student and staff record compatibility
        run: npm run test:v47:multilingual-records
      - name: Verified student preview
        run: npm run test:v47:verified-student-preview
      - name: Firestore student preview adapter
        run: npm run test:v47:firestore-student-preview
      - name: Verified import panel
        run: npm run test:v47:verified-panel
      - name: Verified student save gate
        run: npm run test:v47:verified-save-gate

      - name: Student import transaction plan
        run: npm run test:v47:student-import-transaction-plan

      - name: Validate IEMIS school rules pattern
        run: npm run test:v47:rules-iemis-syntax

      - name: Validate numeric IEMIS emulator school fixtures
        run: npm run test:v47:emulator-school-fixtures

      - name: Firestore rules emulator isolation checks
        run: npm run test:v47:emulator

      - name: V46 student import record compatibility
        run: npm run test:v47:student-import-record-adapter

      - name: Firestore student import schema
        run: npm run test:v47:student-import-rules
