name: V47 live access diagnostic (read only)
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - '.github/workflows/v47-live-access-diagnostic.yml'
permissions:
  contents: read
jobs:
  read-only-diagnostic:
    if: github.ref == 'refs/heads/smss-v47-multischool-work'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Admin SDK
        run: npm install --prefix v47-runtime --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Inspect deployed rules and root admin registry without changes
        env:
          V47_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMSS_EXAM_PORTAL_V47 }}
        run: |
          test -n "$V47_SERVICE_ACCOUNT"
          umask 077
          credential_file="$(mktemp "$RUNNER_TEMP/v47-diag.XXXXXX")"
          trap 'rm -f "$credential_file"' EXIT
          printf '%s' "$V47_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          unset V47_SERVICE_ACCOUNT
          node v47/diagnostics/check-live-access.mjs
