name: V47 Marks Publication Unit Tests (No Deployment)
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - 'v47/server-*.mjs'
      - 'v47/configured-*.mjs'
      - 'v47/test-server-*.mjs'
      - 'v47/test-configured-*.mjs'
      - '.github/workflows/v47-publication-unit-tests.yml'
      - 'src/v47/official-marks-http-handler.mjs'
      - 'src/v47/read-api-router.mjs'
      - 'scripts/test-v47-official-marks-http.mjs'
      - 'src/v47/publication-review-http-handler.mjs'
      - 'scripts/test-v47-publication-review-http.mjs'
permissions:
  contents: read
concurrency:
  group: v47-publication-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check publication validation and official-reader regression tests
        run: |
          set -euo pipefail
          node v47/test-server-publication-pointer-plan.mjs
          node v47/test-server-class-review-confirmation.mjs
          node v47/test-server-staged-class-integrity.mjs
          node v47/test-server-publication-transition-preflight.mjs
          node v47/test-server-official-marks-reader.mjs
          node v47/test-server-official-marks-firestore-loader.mjs
          node scripts/test-v47-official-marks-http.mjs
          node scripts/test-v47-publication-review-http.mjs
          node v47/test-server-verified-official-class-marks.mjs
          node v47/test-server-publication-staging-executor.mjs
          node v47/test-server-publication-authoritative-preflight.mjs
          node v47/test-server-official-publication-commit.mjs
          node v47/test-server-publication-authoritative-loader.mjs
      - name: Explain test scope
        if: always()
        run: |
          {
            echo '## Publication unit tests'
            echo 'These tests exercise validation, mocked Firebase Admin SDK source reads and simulated staged/official publication transactions including atomic CAS checks.'
            echo 'They do not replace real Firebase Admin SDK emulator transactions, browser behavior, CDC/IEMIS parity or V47 production readiness.'
            echo 'No deployment or production data writes occur in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
  publication-admin-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firestore emulator and Admin SDK dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install isolated V47 server dependencies
        run: npm install --prefix v47-runtime --no-package-lock --no-audit --no-fund
      - name: Run real Firebase Admin SDK publication transaction on isolated emulator
        env:
          NODE_OPTIONS: --unhandled-rejections=strict
          V47_REQUIRE_PUBLICATION_EMULATOR: 'true'
        run: |
          npx firebase emulators:exec --config v47/firebase.v47.json \
            --project smss-v47-marks-local-ci --only firestore \
            "node v47/test-server-publication-admin-emulator.mjs"
      - name: Explain boundary
        if: always()
        run: |
          {
            echo '## Isolated Firebase Admin SDK publication emulator'
            echo 'Real transaction reads, 101-student school-scoped staging and atomic pointer/header/audit are exercised only in a local emulator.'
            echo 'No hosting deployment, real Firebase credentials or production Firestore writes.'
            echo 'This is NOT full CDC/IEMIS parity, browser E2E, transaction-load approval for 1500 students or production release.'
          } >> "$GITHUB_STEP_SUMMARY"
