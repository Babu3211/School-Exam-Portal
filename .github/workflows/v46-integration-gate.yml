name: V46 integration preservation gate
on:
  push:
    branches:
      - smss-v46-integration
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  structural-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node scripts/check-inline-js.mjs
          node --check cdc-question-paper.js
          node --check scripts/test-v46-preservation.mjs
      - name: V46 preservation gate
        run: npm run test:v46-preservation
      - name: Teacher and student class normalization regression
        run: npm run test:v46-class-normalization
      - name: English exam dropdown preservation
        run: npm run test:v46-english-exam
      - name: English attendance subject dropdown preservation
        run: npm run test:v46-attendance-english
      - name: V44 regression gate
        run: node scripts/check-v44-requirements.mjs
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: IEMIS, PWA, question paper and V45 UI regression
        run: |
          npm run test:iemis
          npm run test:pwa
          npm run test:question-paper
          npm run test:v45
# No Firebase deploy or Firestore writes in this workflow.
