name: Release SMSS V46 Firestore Rules (approved, gated)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-V46-RULES to authorize rules-only production release'
        required: true
        type: string
      expected_commit:
        description: 'Full 40-character approved main commit SHA'
        required: true
        type: string
      backup_confirmation:
        description: 'Type BACKUP-VERIFIED only after independently checking an accessible production backup and rollback plan'
        required: true
        type: string
      roles_confirmation:
        description: 'Type ROLES-VERIFIED only after Admin, Teacher and Viewer role assignments have been checked'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: smss-production-firestore-rules
  cancel-in-progress: false
jobs:
  verify-and-deploy-rules:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-V46-RULES' && inputs.backup_confirmation == 'BACKUP-VERIFIED' && inputs.roles_confirmation == 'ROLES-VERIFIED' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify approved commit and rules-only target
        env:
          APPROVED_SHA: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "${#APPROVED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test -f firestore.rules
          test -f firebase.json
          node -e 'const c=require("./firebase.json");if(c.firestore?.rules!=="firestore.rules")process.exit(1)'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test and deploy dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Verify Firestore rules and role isolation before release
        run: |
          set -euo pipefail
          npm run test:rules
          npm run test:viewer
          npm run test:user-activity-rules
          node scripts/test-v46-viewer-class-exam-readonly.mjs
          node scripts/test-v46-user-activity-security.mjs
          npm run test:v46-preservation
      - name: Authenticate with existing production Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          project_id: exam-portal-smss-95016
      - name: Deploy Firestore security rules ONLY
        run: npx firebase-tools deploy --only firestore:rules --project exam-portal-smss-95016 --non-interactive
# Does not deploy Hosting, indexes, functions or write any school documents.
# Requires existing production environment approval and independently verified backup/role inputs.
