name: V46 Local Backup Synthetic Test (never production)
on:
  push:
    branches:
      - feat/v46-question-autogen-grid-safe-2083
    paths:
      - 'scripts/v46-local-firestore-backup.py'
      - '.github/workflows/v46-local-backup-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography
      - run: python scripts/v46-local-firestore-backup.py --self-test
      - name: Refuse real backup in CI
        run: |
          if python scripts/v46-local-firestore-backup.py --output /tmp/forbidden.enc --confirm READ-ONLY-V46-BACKUP; then exit 1; fi
          test ! -e /tmp/forbidden.enc
