name: V44 JavaScript and Firestore Security Checks

on:
  push:
    branches:
      - smss-v44-work
  pull_request:
    branches:
      - smss-v44-work

permissions:
  contents: read

jobs:
  quality-and-rules:
    name: JavaScript quality and Firestore Rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Parse every inline JavaScript block
        run: node scripts/check-inline-js.mjs
      - name: Run V44 requirement regression checks
        run: node scripts/check-v44-requirements.mjs
      - name: Run Firestore Security Rules emulator tests
        run: npm run test:rules
