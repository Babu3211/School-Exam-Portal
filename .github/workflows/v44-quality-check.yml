name: V44 JavaScript and Firestore Security Checks

on:
  push:
    branches:
      - main
      - smss-v44-work
  pull_request:
    branches:
      - main
      - smss-v44-work

permissions:
  contents: read

jobs:
  quality-and-rules:
    name: JavaScript quality and Firestore Rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Parse every inline JavaScript block
        run: node scripts/check-inline-js.mjs
      - name: Run V44 requirement regression checks
        run: node scripts/check-v44-requirements.mjs
      - name: Run Firestore Security Rules emulator tests
        run: npm run test:rules

  deploy-live:
    name: Deploy approved V45 to Firebase Hosting after tests pass
    needs: quality-and-rules
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: deploy approved V45 to production [deploy-v45-live]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested V44 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Deploy tested Firestore Security Rules
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          npx --yes firebase-tools@14 deploy --only firestore:rules --project exam-portal-smss-95016 --non-interactive
      - name: Deploy live to Firebase Hosting (Spark-compatible)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: live
          entryPoint: .
