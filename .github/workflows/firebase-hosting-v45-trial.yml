name: Deploy SMSS V45 Trial to Firebase Hosting

on:
  push:
    branches:
      - smss-v45-work

permissions:
  contents: read

jobs:
  verify-and-deploy-v45-trial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V45 source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Parse every inline JavaScript block
        run: node scripts/check-inline-js.mjs
      - name: Run V45 Grade Ledger and requirement regression checks
        run: node scripts/check-v44-requirements.mjs
      - name: Run Firestore Security Rules emulator tests
        run: npm run test:rules
      - name: Deploy V45 to isolated Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: v45-trial
          expires: 7d
          entryPoint: .
