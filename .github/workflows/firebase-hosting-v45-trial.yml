name: Deploy SMSS V45 Trial to Firebase Hosting

on:
  workflow_run:
    workflows:
      - V45 JavaScript and Firestore Security Checks
    types:
      - completed
    branches:
      - smss-v45-work

permissions:
  contents: read

jobs:
  deploy-v45-trial:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'smss-v45-work' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested V45 commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name || github.repository }}
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Deploy V45 to isolated Firebase Preview Channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: v45-trial
          expires: 7d
          entryPoint: .
