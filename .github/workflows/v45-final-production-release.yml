name: Release verified SMSS V45 Final to Firebase Hosting
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-V45-FINAL after school-account and APK smoke testing'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: smss-production-hosting
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: ${{ github.event.inputs.confirmation == 'DEPLOY-V45-FINAL' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smss-v45-final-integration
          persist-credentials: false
      - name: Confirm final source branch
        run: test "$(git branch --show-current)" = 'smss-v45-final-integration'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Full static, regression and viewer checks
        run: |
          node scripts/check-inline-js.mjs
          node --check user-activity.js
          node --check idle-logout.js
          node scripts/check-v44-requirements.mjs
          node scripts/test-v45-final-integration.mjs
          node scripts/test-attendance-bs-today.mjs
          node scripts/test-v45-ui.mjs
          node scripts/test-dropdown-language.mjs
          npm run test:question-paper
          npm run test:pwa
          npm run test:viewer
          npm run test:rules
          npx firebase emulators:exec --only firestore --project smss-v45-activity-test 'node scripts/test-user-activity-rules.mjs'
      - name: Verify preserved Android and iOS icons
        run: |
          python - <<'PY'
          import struct
          for filename,expected in [('icon-192.png',192),('icon-512.png',512),('apple-touch-icon.png',180)]:
              with open(filename,'rb') as f: h=f.read(24)
              assert h[:8]==bytes.fromhex('89504e470d0a1a0a'),filename
              assert struct.unpack('>II',h[16:24])==(expected,expected),filename
          PY
      - name: Deploy Hosting only; never deploy Firestore rules or modify school records
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: live
          entryPoint: .
      - name: Verify live site and preserved mobile assets
        run: |
          set -euo pipefail
          url=https://exam-portal-smss-95016.web.app
          curl --fail --location --retry 5 --retry-delay 3 "$url/" -o /tmp/smss-index.html
          grep -Fq 'SMSS Exam Portal' /tmp/smss-index.html
          curl --fail --location "$url/user-activity.js" -o /tmp/smss-activity.js
          grep -Fq 'initUserActivity' /tmp/smss-activity.js
          curl --fail --location "$url/manifest.webmanifest" -o /tmp/smss-manifest.json
          node -e 'const m=require("/tmp/smss-manifest.json");if(m.name!=="SMSS Exam Portal"||!m.icons.some(x=>x.src==="./icon-512.png"))process.exit(1)'
          for asset in icon-192.png icon-512.png apple-touch-icon.png; do
            curl --fail --location "$url/$asset" -o "/tmp/$asset"
            ASSET_PATH="/tmp/$asset" node -e 'const fs=require("node:fs");const b=fs.readFileSync(process.env.ASSET_PATH);if(b.length<100||b.subarray(0,8).toString("hex")!=="89504e470d0a1a0a")process.exit(1)'
          done
# Firestore rules need a separate approved release. Hosting deployment does not update them.
