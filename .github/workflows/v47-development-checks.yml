name: V47 Multi-School Development Checks
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
  pull_request:
    paths:
      - 'src/v47/**'
      - 'prototypes/v47/**'
      - 'scripts/build-v47-spark-staging.mjs'
      - 'firebase.v47.spark.json'
      - 'scripts/test-v47-*.mjs'
      - 'scripts/prepare-v47-v46-ui-port.mjs'
      - 'scripts/audit-v46-tenant-migration.mjs'
      - 'firestore.v47.prototype.rules'
      - 'firebase.v47.emulator.json'
      - '.github/workflows/v47-development-checks.yml'
permissions:
  contents: read
jobs:
  v47-isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install development test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Ensure V46 production files remain unchanged
        run: node scripts/test-v47-production-boundary.mjs
      - name: Build isolated V47 Spark static staging preview (no deploy)
        if: success() || failure()
        run: |
          node scripts/build-v47-spark-staging.mjs
          if V47_SPARK_RELEASE_BUILD=true node scripts/build-v47-spark-staging.mjs; then
            echo "ERROR: release build accepted missing Firebase configuration"
            exit 1
          fi
          V47_SPARK_RELEASE_BUILD=true V47_SPARK_WEB_CONFIG='{"projectId":"smss-exam-portal-v47","authDomain":"smss-exam-portal-v47.firebaseapp.com","apiKey":"synthetic-ci-key","appId":"synthetic-ci-app"}' node scripts/build-v47-spark-staging.mjs
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("firebase.v47.spark.json","utf8")); if(Object.keys(c).join(",")!=="hosting" || c.hosting.public!=="dist/v47-spark") process.exit(1);'
          V47_SPARK_WEB_CONFIG='{"projectId":"smss-exam-portal-v47","authDomain":"smss-exam-portal-v47.firebaseapp.com","apiKey":"synthetic-ci-key","appId":"synthetic-ci-app"}' node scripts/build-v47-spark-staging.mjs
          test -f dist/v47-spark/prototypes/v47/spark-config.js
          grep -q 'window.__SMSS_V47_SPARK_CONFIG__' dist/v47-spark/prototypes/v47/spark-config.js
          grep -q 'spark-config.js' dist/v47-spark/prototypes/v47/spark-school-registration.html
          if V47_SPARK_WEB_CONFIG='not-json' node scripts/build-v47-spark-staging.mjs; then
            echo "ERROR: invalid JSON was accepted in V47 build"
            exit 1
          fi
          if V47_SPARK_WEB_CONFIG='{"projectId":"exam-portal-smss-95016","authDomain":"exam-portal-smss-95016.firebaseapp.com","apiKey":"wrong","appId":"wrong"}' node scripts/build-v47-spark-staging.mjs; then
            echo "ERROR: V46 Firebase project was accepted in V47 build"
            exit 1
          fi
          if V47_SPARK_WEB_CONFIG='{"projectId":"smss-exam-portal-v47","authDomain":"smss-exam-portal-v47.firebaseapp.com","apiKey":"synthetic","appId":"synthetic","storageBucket":"exam-portal-smss-95016.appspot.com"}' node scripts/build-v47-spark-staging.mjs; then
            echo "ERROR: V46 storage bucket was accepted"
            exit 1
          fi
          node scripts/build-v47-spark-staging.mjs
          if grep -R -l -E 'exam-portal-smss-95016|K6uSLmqg0vWCtCuzwtxKzFpQMu62' dist/v47-spark; then
            echo "ERROR: V46 production identity leaked into isolated V47 staging"
            exit 1
          fi
          test ! -e dist/v47-spark/prototypes/v47/spark-config.js
          test ! -e dist/v47-spark/index.html.bak
          test ! -e dist/v47-spark/firebase.json
          test ! -e dist/v47-spark/firestore.rules
          test ! -e dist/v47-spark/scripts
          test ! -e dist/v47-spark/docs
          test ! -e dist/v47-spark/sw.js
          test -f dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'schoolSnapshot.data()?.status!=="active"' dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'Membership starts only after that user signs in and accepts' dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'Sign out failed. Please retry.' dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'document.querySelector("#login-form").hidden=!!user' dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'document.querySelector("#password").value=""' dist/v47-spark/prototypes/v47/spark-school-registration.html
          grep -q 'epoch!==authEpoch' dist/v47-spark/prototypes/v47/spark-school-registration.html
          test "$(grep -Fc 'verifiedSchoolId!==schoolId || epoch!==verificationEpoch' dist/v47-spark/prototypes/v47/spark-school-registration.html)" -eq 2
          test "$(grep -Fc 'recheckManagement(input)' dist/v47-spark/prototypes/v47/spark-school-registration.html)" -eq 4
          test "$(grep -Fc 'await recheckManagement({schoolId});' dist/v47-spark/prototypes/v47/spark-school-registration.html)" -eq 2
          test "$(grep -Fc 'epoch!==verificationEpoch)return;' dist/v47-spark/prototypes/v47/spark-school-registration.html)" -ge 5
          test -f dist/v47-spark/prototypes/v47/spark-school-marks.html
          test -f dist/v47-spark/prototypes/v47/spark-school-attendance.html
          test -f dist/v47-spark/prototypes/v47/spark-school-students.html
          test -f dist/v47-spark/iemis-ledger.js
          test -f dist/v47-spark/prototypes/v47/v46-grade-calculator.html
          grep -q '../../iemis-ledger.js' dist/v47-spark/prototypes/v47/v46-grade-calculator.html
          if grep -q 'exam-portal-smss-95016' dist/v47-spark/prototypes/v47/v46-grade-calculator.html; then exit 1; fi
          test -f dist/v47-spark/prototypes/v47/spark-school-workspace.html
          grep -q 'createV46VerifiedReadSession' dist/v47-spark/prototypes/v47/spark-school-workspace.html
          grep -q 'schoolReads.listPage(kind,{pageSize:PAGE_SIZE})' dist/v47-spark/prototypes/v47/spark-school-workspace.html
          grep -q 'schoolReads.listPage(kind,{pageSize:PAGE_SIZE,cursor})' dist/v47-spark/prototypes/v47/spark-school-workspace.html
          grep -q 'tables.replaceChildren(...staged)' dist/v47-spark/prototypes/v47/spark-school-workspace.html
          grep -q 'School access changed during loading' dist/v47-spark/prototypes/v47/spark-school-workspace.html
          test "$(grep -Fc 'latestMember.data().roles' dist/v47-spark/prototypes/v47/spark-school-workspace.html)" -ge 1
      - name: Publish isolated V47 Spark preview artifact (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v47-spark-preview
          path: dist/v47-spark/
          if-no-files-found: error
          retention-days: 7
      - name: V46 existing exam portal regression suite (read-only)
        if: success() || failure()
        run: |
          node scripts/check-inline-js.mjs
          node scripts/check-v44-requirements.mjs
          npm run test:iemis
          npm run test:pwa
          npm run test:v45
          npm run test:v46-preservation
          npm run test:v46-class-normalization
          npm run test:v46-english-exam
          npm run test:v46-attendance-english
