name: V47 real browser emulator E2E (No Deployment)
on:
  workflow_dispatch:
  push:
    branches: [smss-v47-multischool-work]
    paths:
      - 'v47/**'
      - '.github/workflows/v47-browser-emulator-e2e.yml'
      - 'v47-runtime/static-handler.mjs'
permissions:
  contents: read
concurrency:
  group: v47-browser-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium-two-schools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test-only dependencies
        run: |
          npm install --no-package-lock --no-audit --no-fund --no-save firebase@11.10.0 esbuild@0.25.5 playwright@1.52.0
          npm install --prefix v47-runtime --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the isolated browser UI
        run: node v47/build-hosting.mjs
      - name: Verify physical grade-sheet print layout using synthetic records
        run: node v47/browser-e2e/grade-sheet-print.mjs
      - name: Run Chromium with real local Auth and Firestore
        env:
          GCLOUD_PROJECT: demo-smss-v47-browser
        run: |
          npx firebase emulators:exec --project demo-smss-v47-browser --config v47/firebase.browser-test.json --only auth,firestore "node v47/browser-e2e/run.mjs"
      - name: Retain synthetic annual review PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v47-synthetic-annual-review-pdfs
          path: v47-annual-print-artifacts/*.pdf
          if-no-files-found: ignore
      - name: Explain verification boundary
        if: always()
        run: |
          echo 'Real Chromium with synthetic Auth/Firestore emulator accounts; all production network requests denied. No live Firebase credentials, hosting deployment or production data. This is not CDC/IEMIS approval or live production acceptance.' >> "$GITHUB_STEP_SUMMARY"
