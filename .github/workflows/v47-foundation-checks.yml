name: V47 tenant foundation checks (no deployment)
on:
  push:
    branches: [smss-v47-multischool-work]
    paths: ['v47/**', '.github/workflows/v47-foundation-checks.yml']
  pull_request:
    paths: ['v47/**', '.github/workflows/v47-foundation-checks.yml']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validate V47 JavaScript module syntax
        run: |
          for file in v47/*.mjs; do node --check "$file"; done
      - name: V47 school isolation and registry static tests
        run: |
          node v47/test-school-scope.mjs
          node v47/test-school-registry.mjs
          node v47/test-registry-schema.mjs
          node v47/test-tenant-query.mjs
          node v47/test-rules-integrity.mjs
          node v47/test-access-policy.mjs
          node v47/test-school-registry-service.mjs
          node v47/test-school-directory.mjs
          node v47/test-school-session.mjs
          node v47/test-tenant-pagination.mjs
          node v47/test-super-admin-dashboard.mjs
          node v47/test-school-registration-form.mjs
          node v47/test-teacher-assignment.mjs
          node v47/test-firebase-registry-adapter.mjs
          node v47/test-super-admin-ui.mjs
          node v47/test-registration-controller.mjs
          node v47/test-school-onboarding.mjs
          node v47/test-console-contract.mjs
          node v47/test-school-access-service.mjs

      - name: Firestore tenant isolation emulator tests
        run: npx firebase emulators:exec --project smss-v47-isolation-test --only firestore --config v47/firebase.emulator.json "node v47/test-firestore-isolation.mjs"
