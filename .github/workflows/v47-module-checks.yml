name: V47 isolated module checks (non-deploy)
on:
  push:
    branches: [smss-v47-multischool-work]
  pull_request:
    branches: [smss-v47-multischool-work]
  workflow_dispatch:
jobs:
  module-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: School-scoped path validation
        run: node scripts/test-v47-school-paths.mjs
      - name: Role boundaries
        run: node scripts/test-v47-permissions.mjs
      - name: Record limits and stale cache
        run: node scripts/test-v47-record-limits.mjs
      - name: School registration validation
        run: node scripts/test-v47-school-registry.mjs
      - name: School membership validation
        run: node scripts/test-v47-school-membership.mjs
      - name: Pagination and deduplication
        run: node scripts/test-v47-pagination.mjs
      - name: School context isolation
        run: node scripts/test-v47-school-context.mjs
      - name: Audit event validation
        run: node scripts/test-v47-audit-events.mjs
      - name: Super Admin registration authorization
        run: node scripts/test-v47-registration-policy.mjs
      - name: Scoped Firestore adapter
        run: node scripts/test-v47-firestore-adapter.mjs
      - name: School registration transaction
        run: node scripts/test-v47-registration-service.mjs
      - name: School activation authorization
        run: node scripts/test-v47-school-status.mjs
      - name: School readiness gate
        run: node scripts/test-v47-school-readiness.mjs
      - name: V47 class-catalog
        run: node scripts/test-v47-class-catalog.mjs
      - name: V47 term-catalog
        run: node scripts/test-v47-term-catalog.mjs
      - name: V47 tenant-query
        run: node scripts/test-v47-tenant-query.mjs
      - name: V47 safe-export
        run: node scripts/test-v47-safe-export.mjs
      - name: V47 version-info
        run: node scripts/test-v47-version-info.mjs
      - name: Atomic school onboarding
        run: node scripts/test-v47-school-onboarding.mjs
      - name: School member management
        run: node scripts/test-v47-member-management.mjs
      - name: Super Admin school list
        run: node scripts/test-v47-school-list-service.mjs
      - name: School detail access
        run: node scripts/test-v47-school-detail-service.mjs
      - name: School member list
        run: node scripts/test-v47-member-list-service.mjs
      - name: V47 admin console static integration
        run: node scripts/test-v47-admin-console-static.mjs
      - name: V47 school admin console static integration
        run: node scripts/test-v47-school-admin-console-static.mjs
      - name: V47 school student browser static integration
        run: node scripts/test-v47-students-console-static.mjs
      - name: V47 school isolation gate
        run: node scripts/test-v47-school-isolation-gate.mjs
      - name: V47 school academic records read-only UI
        run: node scripts/test-v47-records-console-static.mjs
      - name: V47 student input validation
        run: node scripts/test-v47-student-validation.mjs
      - name: V47 school-scoped student create service
        run: node scripts/test-v47-student-service.mjs
      - name: V47 attendance service and date validation
        run: node scripts/test-v47-attendance-service.mjs
      - name: Nepal local Gregorian date boundaries
        run: node scripts/test-v47-nepal-date.mjs
      - name: V47 school-scoped attendance UI
        run: node scripts/test-v47-attendance-console-static.mjs
      - name: V47 paginated class roster
        run: node scripts/test-v47-attendance-roster.mjs
      - name: V47 attendance class and date query
        run: node scripts/test-v47-attendance-query.mjs
      - name: V47 atomic class attendance batch
        run: node scripts/test-v47-attendance-bulk.mjs
      - name: V47 chunked class attendance and partial failure tests
        run: node scripts/test-v47-attendance-class-save.mjs
      - name: V47 school-scoped marks foundation
        run: node scripts/test-v47-marks-service.mjs
      - name: V47 marks rules structural safety
        run: node scripts/test-v47-marks-rules-static.mjs
      - name: V47 class-term mark query
        run: node scripts/test-v47-marks-query.mjs
      - name: V47 marks preview static checks
        run: node scripts/test-v47-marks-preview-static.mjs
      - name: Existing V46 preservation gate
        run: node scripts/test-v46-preservation.mjs
