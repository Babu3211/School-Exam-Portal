name: V47 structural checks (development only)
on:
  push:
    branches:
      - smss-v47-multischool-work
    paths:
      - 'v47/**'
      - 'scripts/test-v47-school-isolation-gate.mjs'
      - 'scripts/test-v47-emulator-isolation.mjs'
      - 'package.json'
      - '.github/workflows/v47-structural-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator test dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run complete V47 unit, structural and Firestore emulator suite
        run: npm run test:v47
