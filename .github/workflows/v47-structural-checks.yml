name: V47 structural checks (development only)
on:
  push:
    branches:
      - smss-v47-multischool-work
    paths:
      - 'v47/**'
      - 'scripts/test-v47-school-isolation-gate.mjs'
      - 'scripts/test-v47-emulator-isolation.mjs'
      - 'package.json'
      - '.github/workflows/v47-structural-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v47-structural-${{ github.ref }}
  cancel-in-progress: true
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator test dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run complete V47 unit, structural and Firestore emulator suite
        run: npm run test:v47
      - name: Audit 15 V47 feature parity and hosting checkpoints
        run: |
          if node v47/audit-feature-parity.mjs > /tmp/v47-feature-audit.log 2>&1; then
            cat /tmp/v47-feature-audit.log
            echo "V47 feature audit has no blockers; independent release review still required"
          else
            cat /tmp/v47-feature-audit.log
            grep -q "V47 readiness audit:" /tmp/v47-feature-audit.log
            echo "V47 feature audit reports outstanding blockers (expected before release)"
          fi
      - name: Verify V47 production release remains blocked
        run: |
          if npm run test:v47:release > /tmp/v47-release-gate.log 2>&1; then
            cat /tmp/v47-release-gate.log
            echo "ERROR: Unsafe V47 production release gate unexpectedly passed"
            exit 1
          fi
          cat /tmp/v47-release-gate.log
          grep -q "V47 PRODUCTION RELEASE BLOCKED" /tmp/v47-release-gate.log
