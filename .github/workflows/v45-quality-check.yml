name: V45 JavaScript and Firestore Security Checks

on:
  push:
    branches:
      - smss-v45-work
  pull_request:
    branches:
      - smss-v45-work

permissions:
  contents: read

jobs:
  quality-and-rules:
    name: V45 JavaScript, Grade Ledger and Firestore Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V45 source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Parse every inline JavaScript block
        run: node scripts/check-inline-js.mjs
      - name: Parse CDC question paper module
        run: node --check cdc-question-paper.js
      - name: Validate CDC question paper seed packs and source register
        run: node scripts/test-question-paper-content.mjs
      - name: Run V45 Grade Ledger and requirement regression checks
        run: node scripts/check-v44-requirements.mjs
      - name: Run Firestore Security Rules emulator tests
        run: npm run test:rules
