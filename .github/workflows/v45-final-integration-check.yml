name: Validate V45 Final Integration (no deployment)

on:
  push:
    branches:
      - smss-v45-final-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect approved dashboard and IEMIS source files
        run: |
          git fetch --no-tags --depth=1 origin main
          python - <<'PY'
          import subprocess, os
          allowed={
            '.github/workflows/v45-final-integration-check.yml', '.github/workflows/v45-final-production-release.yml', '.github/workflows/v45-final-firestore-rules-release.yml',
            'index.html', 'user-activity.js', 'idle-logout.js',
            'firestore.rules', 'scripts/test-v45-final-integration.mjs', 'scripts/test-attendance-bs-today.mjs', 'scripts/test-student-loading-regression.mjs', 'scripts/check-v44-requirements.mjs', 'scripts/test-user-activity-rules.mjs'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main','HEAD'],text=True).splitlines())
          # Excel transfer introduces an isolated IEMIS extension and its regressions.
          if os.environ.get('GITHUB_HEAD_REF')=='feat/iemis-exam-importer':
            allowed.update({'iemis-transfer-export.js', 'package.json', 'sw.js',
              '.github/workflows/iemis-transfer-check.yml',
              'scripts/test-iemis-transfer.mjs', 'scripts/test-iemis-importer-dom.mjs'})
            allowed.update(path for path in changed if path.startswith('iemis-importer/'))
          if os.environ.get('GITHUB_HEAD_REF')=='fix/iemis-order-computer':
            allowed.update({'iemis-transfer-export.js','iemis-importer/transfer.js',
              'scripts/test-iemis-transfer.mjs','sw.js'})

          if os.environ.get('GITHUB_HEAD_REF')=='fix/teacher-all-sections-marks' or os.environ.get('GITHUB_REF_NAME')=='fix/teacher-all-sections-marks':
            allowed.add('scripts/test-firestore-rules.mjs')
          # V46 integration has its own preservation/security gates. Permit only
          # explicitly reviewed V46 test/docs additions and test harness updates;
          # never relax protection for production PWA, Android, or other source.
          if os.environ.get('GITHUB_HEAD_REF')=='smss-v46-integration' or os.environ.get('GITHUB_REF_NAME')=='smss-v46-integration':
            allowed.update({'.github/workflows/v46-integration-gate.yml', '.github/workflows/v46-non-iemis-readiness.yml', '.github/workflows/v46-production-release.yml', '.github/workflows/v46-hosting-preview.yml',
              'docs/V46-FEATURE-DIFFERENCE-AUDIT.md', 'docs/V46-SINGLE-SOURCE-OF-TRUTH.md', 'docs/V46-PRODUCTION-RELEASE-ROLLBACK-CHECKLIST.md', 'docs/V46-FREE-FIRESTORE-BACKUP-PLAN.md', 'docs/V46-MOBILE-ONLY-FREE-RELEASE-HANDOFF.md',
              'package.json', 'scripts/test-firestore-rules.mjs', 'scripts/test-iemis-entry.mjs'})
            allowed.update(p for p in changed if p.startswith('scripts/test-v46-') and p.endswith('.mjs'))
          # V46 delete-safety branch: exact reviewed change scope only.
          # Keep dashboard, IEMIS and all other production files protected.
          if os.environ.get('GITHUB_HEAD_REF')=='smss-v46-exam-delete-safety' or os.environ.get('GITHUB_REF_NAME')=='smss-v46-exam-delete-safety':
            allowed.update({
              '.github/workflows/v45-final-integration-check.yml',
              '.github/workflows/v46-delete-safety-check.yml',
              '.github/workflows/android-apk.yml',
              'android-app/scripts/patch-relaunch-recovery.mjs',
              'package.json',
              'scripts/test-v46-delete-controls.mjs',
              'scripts/test-v46-viewer-class-exam-readonly.mjs'
            })
          # Exam+marks deletion PR: permit only the updated static safety test.
          # Production application source remains subject to all normal gates.
          if os.environ.get('GITHUB_HEAD_REF')=='smss-v46-exam-marks-cascade-delete' or os.environ.get('GITHUB_REF_NAME')=='smss-v46-exam-marks-cascade-delete':
            allowed.update({'.github/workflows/v45-final-integration-check.yml',
              'scripts/test-v46-delete-controls.mjs'})
          # This school-authorized IEMIS verification branch has a separate,
          # exact file scope. All dashboard, permission and emulator checks below
          # still run; other branches retain the existing source freeze.
          if os.environ.get('GITHUB_HEAD_REF')=='fix/iemis-class6-2083-term-sheets' or os.environ.get('GITHUB_REF_NAME')=='fix/iemis-class6-2083-term-sheets':
            allowed.update({'docs/IEMIS-PARITY-AUDIT.md', 'iemis-ledger.js',
              'iemis-entry.js', 'scripts/fixtures/iemis-entry.html',
              'scripts/fixtures/iemis-layout.html', 'scripts/test-iemis-ledger.mjs', 'scripts/test-iemis-entry.mjs', 'sw.js'})
            # The Computer regression additions must preserve every existing entry test.
            entry_tests_before=subprocess.check_output(['git','show','origin/main:scripts/test-iemis-entry.mjs'],text=True)
            assert open('scripts/test-iemis-entry.mjs').read().startswith(entry_tests_before), 'Existing entry tests must remain intact'
            # Companion files may only receive the matching module/cache version.
            for path in ['iemis-entry.js', 'scripts/fixtures/iemis-entry.html', 'scripts/fixtures/iemis-layout.html', 'sw.js']:
              before=subprocess.check_output(['git','show','origin/main:'+path],text=True)
              after=open(path).read()
              expected=before.replace('20261109-legacy2','20261115-class6-ledger')
              if path=='sw.js':
                expected=expected.replace('smss-pwa-v51-network-refresh-20261110','smss-pwa-v51-class6-ledger-20261115')
              assert after==expected, f'Unexpected behavioral change in protected companion file: {path}'
          if os.environ.get('GITHUB_HEAD_REF')=='fix/viewer-iemis-grid-readonly':
            allowed.update({'iemis-entry.js','scripts/test-iemis-importer-dom.mjs',
              'scripts/fixtures/iemis-entry.html','scripts/fixtures/iemis-layout.html','sw.js'})
          if os.environ.get('GITHUB_HEAD_REF')=='fix/backup-audit-preview':
            allowed.add('sw.js')
          if os.environ.get('GITHUB_HEAD_REF')=='feat/v46-cdc-assessment':
            allowed.update({'scripts/test-cdc-assignment.mjs','scripts/test-firestore-rules.mjs'})
          # Dedicated primary assessment follow-up: exact tests and source register only.
          if os.environ.get('GITHUB_HEAD_REF')=='feat/v46-cdc-continuous-year':
            allowed.update({'scripts/test-firestore-rules.mjs','scripts/test-cdc-assignment.mjs'})
          if os.environ.get('GITHUB_HEAD_REF') in ('fix/v46-cdc-simple-teacher-form','fix/v46-cdc-entry-visible'):
            allowed.add('scripts/test-cdc-assignment.mjs')
          if os.environ.get('GITHUB_HEAD_REF')=='feat/v46-cdc-assessment-official-forms':
            allowed.update({'scripts/test-cdc-assignment.mjs','scripts/test-firestore-rules.mjs','docs/cdc-assessment-reference-sources.md'})
          # Exact file scope for the school-approved question-paper integration PR.
          # This does not permit dashboard, IEMIS, Android or Firestore changes.
          if os.environ.get('GITHUB_HEAD_REF')=='feat/v46-question-autogen-grid-safe-2083':
            allowed={
              ".github/workflows/v45-final-integration-check.yml",
              ".github/workflows/v46-grade9-seen-prose.yml",
              ".github/workflows/v46-question-autogen-dev.yml",
              ".github/workflows/v46-question-review-hosting-preview.yml",
              ".github/workflows/v46-grade9-grid-catalog-audit.yml",
              "scripts/audit-grade9-grid-catalog.py",
              "scripts/v46-local-firestore-backup.py",
              "scripts/test-v46-backup-restore-emulator.py",
              ".github/workflows/v46-local-backup-test.yml",
              "docs/V46-FREE-FIRESTORE-BACKUP-PLAN.md",
              "cdc-exact-grid.mjs",
              "cdc-grade8-science-model-audit.mjs",
              "cdc-grade8-science-original-supplement.mjs",
              "cdc-grade9-compulsory-math-grouped.mjs",
              "cdc-grade9-compulsory-math-practice.mjs",
              "cdc-grade9-compulsory-math-reference-bank.mjs",
              "cdc-grade9-computer-original-practice.mjs",
              "cdc-grade9-english-grouped-planner.mjs",
              "cdc-grade9-english-practice.mjs",
              "cdc-grade9-english-reference-bank.mjs",
              "cdc-grade9-english-seen-prose-data.mjs",
              "cdc-grade9-english-seen-reference.mjs",
              "cdc-grade9-environment-original-practice.mjs",
              "cdc-grade9-environment-reference-bank.mjs",
              "cdc-grade9-model-reference-audit.mjs",
              "cdc-grade9-nepali-grouped-planner.mjs",
              "cdc-grade9-nepali-model-2078.mjs",
              "cdc-grade9-nepali-practice.mjs",
              "cdc-grade9-nepali-reference-bank.mjs",
              "cdc-grade9-nepali-textbook-reference.mjs",
              "cdc-grade9-paper-grid-guard.mjs",
              "cdc-grade9-reference-preview.mjs",
              "cdc-grade9-grid-library.mjs",
              "cdc-grade9-reference-readiness.mjs",
              "cdc-grade9-release-audit.mjs",
              "cdc-grade9-science-archive-audit.mjs",
              "cdc-grade9-science-original-practice.mjs",
              "cdc-grade9-science-reference-planner.mjs",
              "cdc-grade9-science-school-reference.mjs",
              "cdc-grade9-social-original-practice.mjs",
              "cdc-grade9-social-reference-bank.mjs",
              "cdc-grade9-social-reference-planner.mjs",
              "cdc-grid-source-index.mjs",
              "cdc-optional-math-2082.mjs",
              "cdc-optional-math-composite.mjs",
              "cdc-optional-math-model-compare.mjs",
              "cdc-optional-math-original-practice.mjs",
              "cdc-optional-math-render.mjs",
              "cdc-question-autogen.mjs",
              "cdc-question-excel.mjs",
              "cdc-question-paper.js",
              "cdc-verified-computer-grids.mjs",
              "data/cdc-grade10-science-practice-pack-v1.json",
              "data/cdc-question-paper-sources-2083.json",
              "data/cdc-science-bilingual-mcq-v1.json",
              "package.json",
              "scripts/check-v44-requirements.mjs",
              "firestore.rules",
              "scripts/test-firestore-rules.mjs",
              "scripts/test-pwa-upgrade.mjs",
              "scripts/prepare-grade9-seen-prose.py",
              "scripts/test-cdc-exact-grid.mjs",
              "scripts/test-cdc-grade8-science-model-audit.mjs",
              "scripts/test-cdc-grade8-science-original-supplement.mjs",
              "scripts/test-cdc-grade9-compulsory-math-grouped.mjs",
              "scripts/test-cdc-grade9-compulsory-math-reference-bank.mjs",
              "scripts/test-cdc-grade9-computer-original-practice.mjs",
              "scripts/test-cdc-grade9-english-grouped-planner.mjs",
              "scripts/test-cdc-grade9-english-reference-bank.mjs",
              "scripts/test-cdc-grade9-english-seen-prose.mjs",
              "scripts/test-cdc-grade9-environment-reference-bank.mjs",
              "scripts/test-cdc-grade9-model-reference-audit.mjs",
              "scripts/test-cdc-grade9-nepali-grouped-planner.mjs",
              "scripts/test-cdc-grade9-nepali-model-2078.mjs",
              "scripts/test-cdc-grade9-nepali-reference-bank.mjs",
              "scripts/test-cdc-grade9-paper-grid-guard.mjs",
              "scripts/test-cdc-grade9-reference-preview.mjs",
              "scripts/test-cdc-grade9-review-pack.mjs",
              "scripts/test-cdc-grade9-reference-readiness.mjs",
              "scripts/test-cdc-grade9-release-audit.mjs",
              "scripts/test-cdc-grade9-science-archive-audit.mjs",
              "scripts/test-cdc-grade9-science-reference-planner.mjs",
              "scripts/test-cdc-grade9-science-school-reference.mjs",
              "scripts/test-cdc-grade9-social-reference-bank.mjs",
              "scripts/test-cdc-grade9-social-reference-planner.mjs",
              "scripts/test-cdc-grid-source-index.mjs",
              "scripts/test-cdc-optional-math-2082.mjs",
              "scripts/test-cdc-optional-math-composite.mjs",
              "scripts/test-cdc-optional-math-model-compare.mjs",
              "scripts/test-cdc-optional-math-original-practice.mjs",
              "scripts/test-cdc-question-autogen.mjs",
              "scripts/test-cdc-question-excel.mjs",
              "scripts/test-cdc-verified-computer-grids.mjs",
              "scripts/test-cdc-very-short.mjs",
              "scripts/test-question-paper-content.mjs",
              "scripts/test-v46-optional-math-ui.mjs",
              "scripts/test-v46-question-paper-dom.mjs",
              "scripts/test-v46-paper-browser-layout.mjs",
              "sw.js",
            }
          # The Grade 9 quick builder cache repair is authorized only for these
          # exact reviewed blob pairs; any new edit in either protected revision
          # requires a fresh comparison. Existing dashboard and release gates stay intact.
          if os.environ.get('GITHUB_HEAD_REF')=='feat/v46-question-autogen-grid-safe-2083':
            for path, before, after in [[".github/workflows/v46-production-release.yml","ba40a4c3db49d20ca9ba6c53ece8b1250921ebbf","74647815ecf29be521f5e84ac328c56649790849"],["firebase.json","b7463565924e85dbd8121c514a6fbd51fea831a7","066badefd07f2994f7893ca6328a8752c06bd406"],["index.html","b300bc9d51ef3f2e026d9e6a3302d65da3e0979d","10bf92daf221647d4cd66438344f5623a814b7c5"]]:
              if path in changed:
                assert subprocess.check_output(['git','rev-parse','origin/main:'+path],text=True).strip()==before, 'Protected base changed: '+path
                assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==after, 'Unexpected protected change: '+path
                allowed.add(path)
          unexpected=changed-allowed
          assert not unexpected, f'Unexpected changes to protected V44/IEMIS files: {sorted(unexpected)}'
          print('Approved dashboard and IEMIS source files remain protected.')
          PY
      - name: Protect existing Android APK and iPhone PWA assets
        run: |
          python - <<'PY'
          import subprocess
          protected=['manifest.webmanifest','service-worker.js','icon-192.png','icon-512.png','apple-touch-icon.png']
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main','HEAD'],text=True).splitlines())
          bad=sorted(set(protected)&changed)
          assert not bad, f'Existing PWA/APK assets unexpectedly modified: {bad}'
          android=[p for p in changed if p.startswith(('android/','.github/workflows/android','gradle/')) or p.endswith(('.apk','.aab'))]
          # Android workflow changes are permitted only on the dedicated
          # V46 delete-safety branch; PWA assets and APK binaries remain frozen.
          import os
          if os.environ.get('GITHUB_HEAD_REF')=='smss-v46-exam-delete-safety' or os.environ.get('GITHUB_REF_NAME')=='smss-v46-exam-delete-safety':
            android=[p for p in android if p != '.github/workflows/android-apk.yml']
          assert not android, f'Existing Android packaging unexpectedly modified: {android}'
          print('Existing Android packaging and iPhone PWA assets are unchanged.')
          PY
      - name: Install test dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: JavaScript syntax and approved dashboard regression
        run: |
          node scripts/check-inline-js.mjs
          if test -f scripts/test-cdc-assignment.mjs; then
            mkdir -p "$RUNNER_TEMP/smss-cdc-print"
            SMSS_CDC_PRINT_DIR="$RUNNER_TEMP/smss-cdc-print" node scripts/test-cdc-assignment.mjs
          fi
          node --check user-activity.js
          node --check idle-logout.js
          node scripts/check-v44-requirements.mjs
          node scripts/test-v45-final-integration.mjs
          node scripts/test-attendance-bs-today.mjs
          node scripts/test-v45-ui.mjs
          node scripts/test-dropdown-language.mjs
      - name: IEMIS calculation and entry regression
        run: npm run test:iemis
      - name: Preserve question paper and PWA behavior
        run: |
          npm run test:question-paper
          npm run test:pwa
      - name: Viewer read-only and Firestore permissions (emulator only)
        run: |
          npm run test:viewer
          npm run test:rules
          npx firebase emulators:exec --only firestore --project smss-v45-activity-test 'node scripts/test-user-activity-rules.mjs'
      - name: Render and verify synthetic A4 Grade Sheet
        if: github.head_ref == 'fix/iemis-class6-2083-term-sheets' || (github.head_ref == 'feat/v46-cdc-assessment-official-forms' || (github.head_ref == 'fix/v46-cdc-simple-teacher-form' || (github.head_ref == 'fix/v46-cdc-entry-visible' || github.head_ref == 'feat/v46-cdc-continuous-year')))
        run: |
          mkdir -p "$RUNNER_TEMP/smss-print"
          report="$RUNNER_TEMP/smss-print"
          SMSS_GRADE_PRINT_FIXTURE="$report/grade.html" SMSS_PRIMARY_PRINT_FIXTURE="$report/primary.html" SMSS_SECONDARY_PRINT_FIXTURE="$report/secondary.html" node scripts/test-iemis-ledger.mjs
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
          for fixture in grade primary secondary; do
            google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf="$report/$fixture.pdf" "file://$report/$fixture.html"
            pdfinfo "$report/$fixture.pdf" | tee "$report/$fixture-info.txt"
            grep -Eq '^Pages:[[:space:]]+1$' "$report/$fixture-info.txt"
            grep -Eq '^Page size:.*\(A4\)' "$report/$fixture-info.txt"
            pdftotext "$report/$fixture.pdf" "$report/$fixture.txt"
            grep -Fq 'GRADE POINT AVERAGE' "$report/$fixture.txt"
            grep -Fq 'Head Teacher' "$report/$fixture.txt"
            pdftoppm -singlefile -r 110 -png "$report/$fixture.pdf" "$report/$fixture"
          done
          grep -Fq "3.54" "$report/primary.txt"
          grep -Fq "26 HOURS" "$report/primary.txt"
          grep -Fq "3.48" "$report/secondary.txt"
          grep -Fq "32 HOURS" "$report/secondary.txt"
          grep -Fq "COMPUTER SCIENCE" "$report/secondary.txt"
      - name: Save synthetic Grade Sheet for visual review
        if: always() && (github.head_ref == 'fix/iemis-class6-2083-term-sheets' || (github.head_ref == 'feat/v46-cdc-assessment-official-forms' || (github.head_ref == 'fix/v46-cdc-simple-teacher-form' || (github.head_ref == 'fix/v46-cdc-entry-visible' || github.head_ref == 'feat/v46-cdc-continuous-year'))))
        uses: actions/upload-artifact@v4
        with:
          name: smss-synthetic-a4-grade-sheet
          path: |
            ${{ runner.temp }}/smss-print/grade.pdf
            ${{ runner.temp }}/smss-print/grade.png
            ${{ runner.temp }}/smss-print/primary.pdf
            ${{ runner.temp }}/smss-print/primary.png
            ${{ runner.temp }}/smss-print/secondary.pdf
            ${{ runner.temp }}/smss-print/secondary.png
            ${{ runner.temp }}/smss-print/*-info.txt
          retention-days: 7
      - name: Render and verify synthetic CDC assessment PDFs
        if: (github.head_ref == 'feat/v46-cdc-assessment-official-forms' || (github.head_ref == 'fix/v46-cdc-simple-teacher-form' || (github.head_ref == 'fix/v46-cdc-entry-visible' || github.head_ref == 'feat/v46-cdc-continuous-year')))
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/smss-cdc-print"
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-noto-core
          for fixture in cdc-annual cdc-math cdc-sero; do
            test -s "$report/$fixture.html"
            google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf="$report/$fixture.pdf" "file://$report/$fixture.html"
            pdfinfo "$report/$fixture.pdf" | tee "$report/$fixture-info.txt"
            grep -Eq '^Page size:.*\(A4\)' "$report/$fixture-info.txt"
            python - "$report/$fixture-info.txt" "$fixture" <<'PY'
          import re, sys
          info=open(sys.argv[1]).read()
          pages=int(re.search(r'^Pages:\s+(\d+)',info,re.M).group(1))
          w,h=map(float,re.search(r'^Page size:\s+([\d.]+) x ([\d.]+)',info,re.M).groups())
          assert pages>=1
          if sys.argv[2]=='cdc-annual':
              assert w<h and pages==1, 'Annual report must fit portrait A4'
          else:
              assert w>h, 'Assessment form must be landscape A4'
              if sys.argv[2]=='cdc-sero':
                  assert pages==1, '24-indicator Serofero review fixture must fit on one page'
          PY
            pdftotext "$report/$fixture.pdf" "$report/$fixture.txt"
            test -s "$report/$fixture.txt"
            pdftoppm -r 110 -png "$report/$fixture.pdf" "$report/$fixture"
          done
          grep -Fq 'Primary' "$report/cdc-annual.txt"
          grep -Fq 'Grade 3 synthetic' "$report/cdc-math.txt"
      - name: Save synthetic CDC assessment PDFs for visual review
        if: always() && (github.head_ref == 'feat/v46-cdc-assessment-official-forms' || (github.head_ref == 'fix/v46-cdc-simple-teacher-form' || (github.head_ref == 'fix/v46-cdc-entry-visible' || github.head_ref == 'feat/v46-cdc-continuous-year')))
        uses: actions/upload-artifact@v4
        with:
          name: smss-synthetic-cdc-assessment-print
          path: |
            ${{ runner.temp }}/smss-cdc-print/*.pdf
            ${{ runner.temp }}/smss-cdc-print/*.png
            ${{ runner.temp }}/smss-cdc-print/*-info.txt
          retention-days: 7
      - name: Verify final V45 source remains the approved dashboard
        run: |
          node --input-type=module -e 'import fs from "node:fs";const s=fs.readFileSync("index.html","utf8");for(const x of ["School Profile","Student Record","Teacher | Staff","initIdleLogout","initUserActivity"])if(!s.includes(x))throw Error("Missing approved V45 feature: "+x);if(s.includes("V45 Trial"))throw Error("Obsolete trial dashboard restored")'


  iemis-hosting-preview:
    name: Verify IEMIS changes on Firebase Hosting preview
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/iemis-class6-2083-term-sheets' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smss-iemis-2083-hosting-preview
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Deploy to dedicated preview channel
        id: preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EXAM_PORTAL_SMSS_95016 }}
          projectId: exam-portal-smss-95016
          channelId: iemis-2083-review
          expires: 7d
          entryPoint: .
      - name: Check deployed portal and IEMIS JavaScript over HTTPS
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.details_url }}
        run: |
          [[ "$PREVIEW_URL" == https://exam-portal-smss-95016--*.web.app ]]
          curl -fsSL --retry 4 "$PREVIEW_URL/" -o "$RUNNER_TEMP/smss-preview.html"
          cmp index.html "$RUNNER_TEMP/smss-preview.html"
          for file in iemis-entry.js iemis-ledger.js sw.js; do
            curl -fsSL --retry 4 "$PREVIEW_URL/$file" -o "$RUNNER_TEMP/$file"
            cmp "$file" "$RUNNER_TEMP/$file"
          done
          echo "Firebase Hosting preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

