<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — Staff</title>
<style>body{font:16px system-ui,sans-serif;max-width:850px;margin:2rem auto;padding:0 1rem;color:#17324d}section{border:1px solid #cbd5e1;border-radius:12px;padding:1rem;margin:1rem 0}label{display:inline-block;margin:.5rem}input,button,select{padding:.6rem}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;text-align:left;padding:.5rem}#status{white-space:pre-wrap}</style></head>
<body><h1>SMSS V47 Staff</h1><p><a href="./spark-school-workspace.html">School workspace</a></p><p>School-scoped staff records. Read-only staff listing for authorized school members. Staff creation and editing remain disabled until the V46 staff schema is integrated.</p>
<section><form id="login"><label>Email <input name="email" type="email" required autocomplete="username"></label><label>Password <input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form><button id="logout" hidden>Sign out</button></section>
<section><form id="school" hidden><label>School ID <input name="schoolId" pattern="[a-zA-Z0-9_-]{8,64}" required autocomplete="off"></label><button>Open staff</button></form><p id="status" role="status" aria-live="polite">Awaiting V47 configuration.</p></section>
<section id="content" hidden><h2 id="school-name"></h2><h3>Staff</h3><table><thead><tr><th>Name</th><th>Email</th><th>Record ID</th></tr></thead><tbody id="rows"></tbody></table><button id="more" hidden>Load more</button></section>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,doc,getDoc,collection,getDocs,query,orderBy,limit,startAfter,} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import {assertSchoolId,schoolCollectionPath} from "../../src/v47/tenant-domain.mjs";
import {verifyV47BrowserMembership} from "../../src/v47/browser-membership-guard.mjs";
const config=window.__SMSS_V47_SPARK_CONFIG__,login=document.querySelector("#login"),schoolForm=document.querySelector("#school"),content=document.querySelector("#content"),status=document.querySelector("#status"),rows=document.querySelector("#rows"),more=document.querySelector("#more");
let auth,db,schoolId=null,schoolName="",cursor=null,epoch=0,loading=false;
const say=s=>status.textContent=s;
function reset(){epoch++;schoolId=null;cursor=null;loading=false;content.hidden=true;more.hidden=true;rows.replaceChildren();}
async function verify(id,user){const [s,m]=await Promise.all([getDoc(doc(db,"schools",id)),getDoc(doc(db,"schools",id,"members",user.uid))]);if(!s.exists()||!m.exists())throw Error("Active school membership required");const access=verifyV47BrowserMembership({schoolId:id,uid:user.uid,school:s.data(),member:m.data()});return {school:s.data(),roles:access.roles};}
async function loadMore(){if(!schoolId||loading||!auth.currentUser)return;const id=schoolId,user=auth.currentUser,token=epoch;loading=true;more.disabled=true;try{await verify(id,user);if(token!==epoch||auth.currentUser?.uid!==user.uid)return;const base=query(collection(db,schoolCollectionPath(id,"staff")),orderBy("__name__"),...(cursor?[startAfter(cursor)]:[]),limit(20));const snap=await getDocs(base);await verify(id,user);if(token!==epoch||auth.currentUser?.uid!==user.uid)return;for(const record of snap.docs){const data=record.data(),tr=document.createElement("tr");for(const value of [data.nameEnglish||data.name||data.staffName||"—",data.email||data.emailId||"—",record.id]){const td=document.createElement("td");td.textContent=String(value);tr.append(td);}rows.append(tr);}if(snap.docs.length)cursor=snap.docs.at(-1);more.hidden=snap.docs.length<20;say("Loaded "+rows.children.length+" staff.");}catch(e){if(token===epoch)say("Unable to load staff: "+e.message);}finally{if(token===epoch){loading=false;more.disabled=false;}}}
if(!config||config.projectId!=="smss-exam-portal-v47"||config.authDomain!=="smss-exam-portal-v47.firebaseapp.com"){login.hidden=true;say("V47 isolated Firebase configuration required. No connection started.");}else{
 const app=initializeApp(config,"v47-staff");auth=getAuth(app);db=getFirestore(app);
 onAuthStateChanged(auth,user=>{reset();login.hidden=!!user;document.querySelector("#logout").hidden=!user;schoolForm.hidden=!user;say(user?"Enter school ID to continue.":"Sign in first.");});
 login.addEventListener("submit",async event=>{event.preventDefault();const f=new FormData(login);try{await signInWithEmailAndPassword(auth,String(f.get("email")),String(f.get("password")));}catch{say("Sign in failed.");}login.elements.namedItem("password").value="";});
 document.querySelector("#logout").addEventListener("click",async()=>{reset();try{await signOut(auth);}catch{say("Sign out failed.");}});
 schoolForm.elements.namedItem("schoolId").addEventListener("input",reset);
 schoolForm.addEventListener("submit",async event=>{event.preventDefault();reset();const token=epoch,user=auth.currentUser;if(!user)return;try{const id=assertSchoolId(String(new FormData(schoolForm).get("schoolId")));const access=await verify(id,user);if(token!==epoch||auth.currentUser?.uid!==user.uid)return;schoolId=id;schoolName=String(access.school.name||id);document.querySelector("#school-name").textContent=schoolName;content.hidden=false;await loadMore();}catch(e){say("Cannot open school: "+e.message);}});
 more.addEventListener("click",loadMore);
}
</script></body></html>
