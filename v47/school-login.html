<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — School Login</title>
<style>body{font:16px system-ui,sans-serif;background:#f3f7fc;color:#16324f;margin:0}main{max-width:740px;margin:28px auto;padding:16px}section{background:white;border:1px solid #d9e3ee;border-radius:12px;padding:22px;margin:16px 0}label{display:block;margin:14px 0}input,button{font:inherit;padding:12px;border:1px solid #a9bdd1;border-radius:8px;box-sizing:border-box;max-width:100%}input{display:block;width:100%;margin-top:6px}button{background:#175eb5;color:white;cursor:pointer;margin:5px 5px 5px 0}button:disabled{opacity:.5}#status{white-space:pre-wrap}.warn{background:#fff4d7;padding:12px;border-radius:8px}dl{display:grid;grid-template-columns:auto 1fr;gap:10px}dt{font-weight:bold}</style></head>
<body><main><h1>SMSS V47 — School Admin</h1><p class="warn">V47 test environment only. V46 production is separate.</p>
<section id="loginArea"><h2>Sign in</h2><label>School ID<input id="schoolId" autocomplete="organization" placeholder="test_school_001" maxlength="64"></label><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in</button></section>
<section id="dashboard" hidden><h2>School dashboard</h2><dl><dt>School</dt><dd id="schoolName"></dd><dt>School ID</dt><dd id="currentSchoolId"></dd><dt>Role</dt><dd id="role"></dd><dt>Account UID</dt><dd id="uid"></dd></dl><p>School-specific student and staff screens are not enabled in this login test.</p><button id="logout">Sign out</button></section>
<section><h2>Status</h2><p id="status" role="status" aria-live="polite">Ready to sign in.</p></section></main><script type="module" src="./school-login.mjs?v=65a2c21"></script></body></html>
