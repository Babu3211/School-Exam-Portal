<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 School Admin — Development</title><style>body{font:15px system-ui;background:#f3f7fc;color:#183650;margin:0}main{max-width:850px;margin:auto;padding:20px}section{background:#fff;padding:18px;border:1px solid #dbe5ee;border-radius:12px;margin:15px 0}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:10px;border:1px solid #b8c9d9;border-radius:7px;max-width:100%}button{background:#175eb5;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.warn{background:#fff5dc;padding:12px}</style></head><body><main><h1>SMSS V47 — School Admin</h1><p class="warn">Development only. V46 production is separate. School Admin membership must be provisioned by a trusted Super Admin.</p><section><h2>V47 Firebase Connection</h2><label>Firebase configuration JSON<textarea id="config" rows="6" style="width:100%" placeholder='{"projectId":"smss-exam-portal-v47"}'></textarea></label><button id="connect">Connect</button><label>School ID <input id="schoolId" placeholder="school_001"></label><label>Email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="login" disabled>Sign in and verify membership</button><button id="logout" disabled>Sign out</button></section><section id="schoolArea" hidden><h2 id="schoolTitle"></h2><h3>Members</h3><button id="refresh">Refresh members</button><div style="overflow:auto"><table><thead><tr><th>UID</th><th>Role</th><th>Active</th><th>Action</th></tr></thead><tbody id="members"></tbody></table></div><h3>Add Teacher / Viewer</h3><label>Existing Firebase Auth UID <input id="memberUid"></label><label>Role <select id="role"><option value="teacher">Teacher</option><option value="viewer">Viewer</option></select></label><button id="add">Add member</button></section><section><p id="message" role="status" aria-live="polite">Waiting for connection</p></section></main><script type="module" src="./school-admin-console.mjs"></script></body></html>
