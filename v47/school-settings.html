<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — School Settings (Read Only)</title><style>body{font:16px system-ui,sans-serif;background:#f2f7fd;color:#193550;margin:0}main{max-width:760px;margin:auto;padding:20px}section{background:#fff;padding:20px;border:1px solid #d8e5f1;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0}input,textarea,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}button{background:#1764b2;color:white;border:0;border-radius:6px}button:disabled{opacity:.5}dt{font-weight:bold;margin-top:12px}dd{margin:4px 0 10px}p.warning{background:#fff0d0;padding:12px;border-radius:8px}</style></head><body><main><h1>SMSS V47 — School Settings</h1><p><a href="./index.html">Development hub</a></p><p class="warning">Read-only development view. Settings are retrieved only from the verified school. No changes are saved.</p><section><label>V47 Firebase configuration JSON<textarea id="config" rows="4"></textarea></label><button id="connect">Connect</button><label>School IEMIS ID <input id="schoolId" inputmode="numeric"></label><label>Email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="login" disabled>Verify school and view settings</button><button id="logout" disabled>Sign out</button></section><section id="settings" hidden><h2>Verified school details</h2><dl><dt>School IEMIS ID</dt><dd id="iemis"></dd><dt>School name</dt><dd id="name"></dd><dt>School status</dt><dd id="active"></dd><dt>Signed-in role</dt><dd id="role"></dd></dl></section><p id="message" role="status" aria-live="polite">Connect to the separate V47 Firebase project.</p></main><script type="module" src="./school-settings-console.mjs"></script></body></html>
