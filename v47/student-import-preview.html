<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — Students Details Import Preview</title>
<style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:auto;padding:24px;background:#f3f7fc;color:#162c45}main{background:white;padding:24px;border-radius:14px}label{display:inline-grid;gap:6px;margin:8px 14px 8px 0}input,button{font:inherit;padding:10px;border:1px solid #9fb3c9;border-radius:8px}button{background:#155ba1;color:white;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px;border-bottom:1px solid #dce6f0;text-align:left}th{background:#eaf2fa}#preview{overflow-x:auto}.note{color:#365877}#error{color:#a51d27}</style>
</head><body><main><h1>Students Details — Import Excel</h1>
<p class="note" lang="ne">यो V47 को सुरक्षित परीक्षण पृष्ठ हो। यहाँ फाइल हेर्न र जाँच्न मात्र मिल्छ; कुनै विद्यार्थी Firebase मा Save हुँदैन।</p>
<form id="importForm"><label>School IEMIS ID<input id="schoolId" inputmode="numeric" pattern="[0-9]{5,20}" required placeholder="School IEMIS Number"></label>
<label>Excel File<input id="excelFile" type="file" accept=".xlsx,.xls,.csv" required></label>
<button type="submit">Preview Students</button></form>
<p class="note" lang="ne">विद्यालयको IEMIS नम्बर Excel को “IEMIS Code” सँग मिल्नुपर्छ। Roll Number खाली भए पनि Preview गर्न मिल्छ।</p>
<p id="error" role="alert" lang="ne"></p><div id="preview" aria-live="polite"></div>
</main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module">
import {mountV47IemisStudentPreview} from './v46-iemis-student-import-panel.mjs';
const form=document.getElementById('importForm'),error=document.getElementById('error');
form.addEventListener('submit',async event=>{
 event.preventDefault();error.textContent='';document.getElementById('preview').replaceChildren();
 try{
  const file=document.getElementById('excelFile').files[0];
  if(!file)throw Error('Excel फाइल छान्नुहोस्।');
  if(!window.XLSX)throw Error('Excel पढ्ने सुविधा लोड भएन। इन्टरनेट जाँच्नुहोस्।');
  const book=window.XLSX.read(await file.arrayBuffer(),{type:'array',raw:false});
  const sheet=book.Sheets[book.SheetNames[0]];
  if(!sheet)throw Error('Excel मा Sheet भेटिएन।');
  const rows=window.XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
  if(!rows.length)throw Error('Excel मा विद्यार्थी विवरण भेटिएन।');
  mountV47IemisStudentPreview({container:document.getElementById('preview'),rows,schoolId:document.getElementById('schoolId').value.trim()});
 }catch(e){error.textContent='पूर्वावलोकन तयार भएन: '+e.message;}
});
</script></body></html>
