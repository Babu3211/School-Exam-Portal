<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — Missing Marks Review</title><style>body{font:15px system-ui,sans-serif;background:#f3f7fb;color:#18344d;margin:0}main{max-width:1000px;margin:auto;padding:18px}section{background:#fff;border:1px solid #dbe5f0;border-radius:12px;padding:16px;margin:12px 0}label{display:block;margin:9px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #b9c9d9;border-radius:7px;max-width:100%;box-sizing:border-box}button{background:#1764b2;color:#fff}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #e0e7ef}.warn{background:#fff0d0;padding:12px;border-radius:8px}</style></head><body><main><h1>SMSS V47 — Missing Marks Review</h1><p class="warn">Read-only development diagnostics. NOT an official CDC/IEMIS Mark Ledger, Grade Ledger, GPA or Grade Sheet. Do not publish results.</p><section><h2>Sign in</h2><label>V47 Firebase configuration JSON<textarea id="config" rows="4"></textarea></label><button id="connect">Connect</button><label>School ID <input id="schoolId"></label><label>Email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="login" disabled>Sign in</button> <button id="logout" disabled>Sign out</button></section><section id="work" hidden><h2 id="heading">School</h2><label>Class <select id="schoolClass"><option>ECD</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><label>Term <select id="term"><option value="1st">1st</option><option value="2nd">2nd</option><option value="final">Final</option></select></label><button id="load">Review missing marks</button> <button id="export" disabled>Export exceptions CSV</button><p id="summary" role="status">No review loaded</p><div style="overflow:auto"><table><thead><tr><th>Student</th><th>Subject</th><th>Issue</th></tr></thead><tbody id="rows"></tbody></table></div><p id="issues"></p></section><section><p id="message" role="status" aria-live="polite">Waiting for connection</p></section></main><script type="module" src="./ledger-exceptions-console.mjs"></script></body></html>
