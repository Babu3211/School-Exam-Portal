<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 Super Admin</title>
<style>body{font:16px system-ui,sans-serif;background:#f2f6fc;color:#15233b;margin:0}main{max-width:960px;margin:auto;padding:20px}section{background:white;padding:18px;border-radius:12px;margin:14px 0}input,button,textarea{box-sizing:border-box;font:inherit;padding:10px;border:1px solid #aab8c8;border-radius:7px;margin:5px}input,textarea{max-width:100%;width:95%}button{background:#195fba;color:white;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}#message{white-space:pre-wrap}</style></head><body><main>
<h1>SMSS V47 · Super Admin</h1><p>Development console — only the separate V47 Firebase project is accepted.</p>
<section><h2>Connect V47</h2><textarea id="config" rows="6" placeholder="V47 Firebase web config JSON"></textarea><button id="connect">Connect</button><p id="connection">Not connected</p></section>
<section><h2>Sign in</h2><input id="email" type="email" autocomplete="username" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="login" disabled>Sign in</button><button id="logout" disabled>Sign out</button><p id="identity">Not signed in</p></section>
<div id="adminArea" hidden>
<section><h2>Schools</h2><button id="refresh">Refresh</button><div style="overflow-x:auto"><table><thead><tr><th>School ID</th><th>School name</th><th>Status</th><th>Action</th></tr></thead><tbody id="schools"></tbody></table></div><button id="next" disabled>Next page</button></section>
<section><h2>Register school and first admin</h2><input id="schoolId" placeholder="School ID"><input id="schoolName" placeholder="School name"><input id="iemis" placeholder="IEMIS code (optional)"><input id="adminUid" placeholder="Existing Firebase Auth UID for first school admin"><button id="register">Register inactive school</button></section>
</div>
<section><strong>Status</strong><p id="message" role="status" aria-live="polite"></p></section>
</main><script type="module" src="./admin-console.mjs"></script></body></html>
