<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS V47 — School Subjects</title><style>body{font:15px system-ui,sans-serif;background:#f3f7fb;color:#18344d;margin:0}main{max-width:760px;margin:auto;padding:18px}section{background:white;border:1px solid #dbe5f0;border-radius:12px;padding:18px;margin:12px 0}label{display:block;margin:10px 0}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #b9c9d9;border-radius:7px;max-width:100%;box-sizing:border-box}button{background:#1764b2;color:white}button:disabled{opacity:.5}.warn{background:#fff0d0;padding:12px;border-radius:8px}</style></head><body><main><h1>V47 — School Subjects</h1><p><a href="./assignments.html">Assign subjects to students</a> · <a href="./marks-entry.html">Raw marks entry</a> · <a href="./computer-marks.html">Computer 4/36/10</a></p><p class="warn">Development only. Add subjects for your school and class. Subject names and IDs must be checked against IEMIS before real exam use. No editing or deleting subjects here.</p><section><label>V47 Firebase configuration JSON<textarea id="config" rows="4"></textarea></label><button id="connect">Connect</button><label>School ID <input id="schoolId"></label><label>Email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="login" disabled>Sign in</button><button id="logout" disabled>Sign out</button></section><section id="work" hidden><h2 id="heading">New subject</h2><label>Subject ID <input id="subjectId" maxlength="128" placeholder="e.g. math_6"></label><label>English subject name <input id="subjectName" maxlength="160"></label><label>Class <select id="schoolClass"><option>ECD</option><option>LKG</option><option>UKG</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></label><button id="save">Create subject (cannot overwrite)</button></section><p id="message" role="status">Waiting for V47 connection</p></main><script type="module" src="./subjects-console.mjs"></script></body></html>
