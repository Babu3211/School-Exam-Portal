<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SMSS IEMIS Entry — Synthetic Test</title><style>body{font:14px Arial,sans-serif;margin:0;background:#f1f3fa;color:#172b4d}main{margin:20px}.panel{background:white;border:1px solid #dde3ed;border-radius:10px;padding:20px;margin:15px 0}select,button{padding:10px;margin:5px}table{border-collapse:collapse;min-width:100%;background:white}th,td{padding:10px;border:1px solid #d2d7df;white-space:nowrap}th{font-size:12px;text-align:left}td{font-size:13px}.tablewrap{overflow:auto;max-height:580px}input[aria-invalid=true]{outline:2px solid #c33}button{background:#6047ce;color:white;border:0;border-radius:6px}#status{min-height:24px;color:#174a8b}pre{white-space:pre-wrap;font-size:12px;max-height:240px;overflow:auto}@media print{@page{size:A4 landscape;margin:10mm}.controls{display:none}.tablewrap{overflow:visible;max-height:none}th,td{font-size:8px;padding:3px}}</style></head><body><main><h1>IEMIS Mark Entry — test data only</h1><p>No connection to IEMIS or Firebase. Save below captures a test payload in this page only.</p><div class="panel controls"><label>Class <select id="testClass"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>Term <select id="testTerm"><option value="first">1st Term</option><option value="second">2nd Term</option><option value="third">3rd Term</option><option value="annual">Final Term</option></select></label><button id="testLoad">Load</button><button id="testSave">Save test data</button><button id="testPrint">Print / PDF</button><p id="status" role="status"></p></div><div class="panel" id="testGrid"></div><div class="panel controls"><b>Captured test records</b><pre id="captured">None saved.</pre></div></main><script type="module">
import {IemisEntryGrid} from '../iemis-entry.js?v=20261109-legacy2';
const students=[{id:'test-a',studentName:'Test Student A',studentIemisNo:'TESTREG001',symbolNo:'TEST001',rollNo:'1'},{id:'test-b',studentName:'Test Student B',studentIemisNo:'TESTREG002',symbolNo:'TEST002',rollNo:'2'}];
const groups={primary:['Nepali','English','Mathematics','Serophero','Hamro Dhunibeshi'],middle:['Nepali','English','Mathematics','Science & Technology','Social Studies & Human Value Education','Health Physical & Creative Art','Hamro Dhunibeshi'],secondary:['COMP. NEPALI (1021)','COMP. ENGLISH (1011)','COMP. MATHEMATICS (1031)','COMP. SCIENCE AND TECHNOLOGY (1041)','COMP. SOCIAL STUDIES (1051)','OPT.I ENVIRONMENT SCIENCE (2041)','OPT.II COMPUTER SCIENCE (3031)','OPT.I ADDITIONAL MATHEMATICS (2021)']};
let grid,records=[];const status=document.getElementById('status');
function load(){if(grid)grid.destroy();records=[];document.getElementById('captured').textContent='None saved.';const cl=Number(document.getElementById('testClass').value),term=document.getElementById('testTerm').value;grid=new IemisEntryGrid(document.getElementById('testGrid'),{classNo:cl,term,examId:'test-exam',subjects:groups[cl<=5?'primary':cl<=8?'middle':'secondary'],students,records,canEdit:(st,sub)=>!/OPT.I ENVIRONMENT/.test(sub)||st.id==='test-a',message:(text,bad)=>{status.textContent=text;status.style.color=bad?'#b42318':'#174a8b';},onSave:async entries=>{for(const e of entries){const record={id:e.key,studentId:e.student.id,examId:'test-exam',subject:e.subject,...e.data};const i=records.findIndex(r=>r.id===record.id);if(i>=0)records[i]=record;else records.push(record);}document.getElementById('captured').textContent=JSON.stringify(records,null,2);return {savedKeys:entries.map(e=>e.key)};}});status.textContent='Select All or a subject, then enter test marks. Untouched cells are never saved.';}
document.getElementById('testLoad').addEventListener('click',load);document.getElementById('testSave').addEventListener('click',async()=>{try{await grid.save();}catch(error){status.textContent=error.message;status.style.color='#b42318';}});document.getElementById('testPrint').addEventListener('click',()=>window.print());load();
</script></body></html>
